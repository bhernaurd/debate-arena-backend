name: Add subscription admin home icon

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-subscription-admin-home-icon.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Wire dedicated subscription admin icon
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('subscriptionAdminDashboardBaseRoutes.js')
          text = path.read_text()
          needle = '  <title>Agora Subscriptions</title>'
          icon_lines = '''  <title>Agora Subscriptions</title>\n  <link rel="apple-touch-icon" sizes="180x180" href="/subscription-admin-icon.png?v=1" />\n  <link rel="icon" type="image/png" sizes="180x180" href="/subscription-admin-icon.png?v=1" />'''

          if '/subscription-admin-icon.png' in text:
              raise SystemExit('Subscription admin icon link is already present')
          count = text.count(needle)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 Agora Subscriptions title tags, found {count}')
          path.write_text(text.replace(needle, icon_lines))

          test_path = Path('test/subscriptionAdminHomeIcon.test.js')
          test_path.write_text('''import assert from 'node:assert/strict';\nimport fs from 'node:fs';\nimport test from 'node:test';\n\ntest('subscription admin uses a dedicated iOS home screen icon', () => {\n  const dashboardSource = fs.readFileSync('subscriptionAdminDashboardBaseRoutes.js', 'utf8');\n  const affiliateSource = fs.readFileSync('affiliateRoutes.js', 'utf8');\n  const icon = fs.readFileSync('public/subscription-admin-icon.png');\n\n  assert.equal((dashboardSource.match(/rel="apple-touch-icon"/g) || []).length, 2);\n  assert.equal((dashboardSource.match(/\\/subscription-admin-icon\\.png\\?v=1/g) || []).length, 4);\n  assert.equal(affiliateSource.includes('/subscription-admin-icon.png'), false);\n  assert.deepEqual([...icon.subarray(0, 8)], [137, 80, 78, 71, 13, 10, 26, 10]);\n});\n''')
          PY
      - name: Install and validate
        run: |
          npm ci
          npm run check
          npm test
      - name: Commit implementation
        shell: bash
        run: |
          rm .github/workflows/add-subscription-admin-home-icon.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add subscriptionAdminDashboardBaseRoutes.js public/subscription-admin-icon.png test/subscriptionAdminHomeIcon.test.js .github/workflows/add-subscription-admin-home-icon.yml
          git commit -m 'Give subscription admin a dedicated home screen icon'
          git push
