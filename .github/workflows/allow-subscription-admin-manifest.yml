name: Allow subscription admin manifest

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/allow-subscription-admin-manifest.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Allow manifest in dashboard CSP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('subscriptionAdminDashboardBaseRoutes.js')
          s = p.read_text()
          old = "font-src 'self'; base-uri 'none';"
          new = "font-src 'self'; manifest-src 'self'; base-uri 'none';"
          if old not in s:
              if new in s:
                  print('Manifest CSP already applied')
              else:
                  raise SystemExit('Expected subscription admin CSP anchor not found')
          else:
              if s.count(old) != 1:
                  raise SystemExit(f'Expected one CSP anchor, found {s.count(old)}')
              s = s.replace(old, new)
              p.write_text(s)
          PY
      - name: Install and validate
        run: |
          npm ci
          npm run check
          npm test
      - name: Commit implementation
        run: |
          rm .github/workflows/allow-subscription-admin-manifest.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add subscriptionAdminDashboardBaseRoutes.js .github/workflows/allow-subscription-admin-manifest.yml
          git commit -m 'Allow subscription admin web app manifest'
          git push
