name: One-time affiliate form defaults update

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  update:
    if: github.event.issue.title == '[automation] update affiliate form defaults'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update Affiliate Admin form defaults
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('affiliateRoutes.js')
          text = path.read_text()

          replacements = [
              (
                  "          '<div class=\"form-group\"><label>Display Name</label><input id=\"newDisplayName\" class=\"field\" placeholder=\"Max Agora\" value=\"\" /></div>' +\n",
                  "          '<div class=\"form-group\"><label>Display Name</label><input id=\"newDisplayName\" class=\"field\" value=\"\" /></div>' +\n",
                  'display name field',
              ),
              (
                  "          '<div class=\"form-group\"><label>Creator Code</label><input id=\"newCode\" class=\"field\" placeholder=\"MAXAGORA\" value=\"' + html(prefill?.customCode || '') + '\" /></div>' +\n",
                  "          '<div class=\"form-group\"><label>Creator Code</label><input id=\"newCode\" class=\"field\" value=\"\" /></div>' +\n",
                  'creator code field',
              ),
              (
                  "          '<div class=\"form-group full\"><label>Shared Apple Offer Reference Name</label><input id=\"newOfferRef\" class=\"field\" placeholder=\"Affiliate First Month $0.99\" value=\"' + html(prefill?.canonical?.offerName || '') + '\" /><div class=\"muted tiny\" style=\"margin-top:5px\">Production affiliates may intentionally share this Apple offer. The creator code identifies the affiliate inside Agora.</div></div>' +\n",
                  "          '<div class=\"form-group full\"><label>Shared Apple Offer Reference Name</label><input id=\"newOfferRef\" class=\"field\" value=\"Affiliate First Month $0.99\" /><div class=\"muted tiny\" style=\"margin-top:5px\">Production affiliates may intentionally share this Apple offer. The creator code identifies the affiliate inside Agora.</div></div>' +\n",
                  'shared Apple offer field',
              ),
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Validate syntax
        run: node --check affiliateRoutes.js

      - name: Commit branch
        shell: bash
        run: |
          git config user.name "Agora Automation"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B automation/affiliate-form-defaults
          git add affiliateRoutes.js
          git commit -m "Clean affiliate form defaults"
          git push --force origin HEAD:refs/heads/automation/affiliate-form-defaults
