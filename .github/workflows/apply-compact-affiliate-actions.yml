name: Apply Compact Affiliate Admin Actions

on:
  push:
    branches:
      - affiliate-actions-cleanup
    paths:
      - .github/workflows/apply-compact-affiliate-actions.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: affiliate-actions-cleanup
          fetch-depth: 0

      - name: Apply compact action layout
        run: node scripts/compactAffiliateActions.mjs

      - name: Validate syntax
        run: node --check affiliateRoutes.js

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run focused regression tests
        run: node --test test/affiliateAdminCompactActions.test.js test/affiliateDeleteAdminV2.test.js

      - name: Run full backend tests
        run: npm test

      - name: Remove one-time patch machinery and restore install artifacts
        run: |
          git restore --worktree --staged node_modules/.package-lock.json 2>/dev/null || true
          rm -f scripts/compactAffiliateActions.mjs
          rm -f .github/workflows/apply-compact-affiliate-actions.yml

      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add affiliateRoutes.js test/affiliateAdminCompactActions.test.js scripts/compactAffiliateActions.mjs .github/workflows/apply-compact-affiliate-actions.yml
          git add -u
          git commit -m "Compact Affiliate Admin row actions"
          git push origin HEAD:affiliate-actions-cleanup
