name: Fix subscription admin Home Screen install

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-subscription-admin-home-screen.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install iOS-safe PNG icons and metadata
        shell: bash
        run: |
          cat > /tmp/admin180.b64 <<'B64'
          
          B64
          cat > /tmp/admin192.b64 <<'B64'
          
          B64
          cat > /tmp/admin512.b64 <<'B64'
          
          B64
          base64 -d /tmp/admin180.b64 > public/apple-touch-icon.png
          cp public/apple-touch-icon.png public/subscription-admin-icon.png
          base64 -d /tmp/admin192.b64 > public/subscription-admin-icon-192.png
          base64 -d /tmp/admin512.b64 > public/subscription-admin-icon-512.png
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/subscriptionAdminMobileUi.js')
          s = p.read_text()
          s = s.replace('subscription-admin.webmanifest?v=3', 'subscription-admin.webmanifest?v=4')
          old = '''    .replaceAll(
      '<link rel="apple-touch-icon" sizes="180x180" href="/subscription-admin-icon.png?v=1" />',
      ''
    )'''
          new = '''    .replaceAll(
      '<link rel="apple-touch-icon" sizes="180x180" href="/subscription-admin-icon.png?v=1" />',
      '<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=6" />'
    )'''
          if old not in s:
              raise SystemExit('apple-touch-icon replacement anchor not found')
          s = s.replace(old, new)
          p.write_text(s)

          Path('public/subscription-admin.webmanifest').write_text('''{
  "id": "/subscription-admin",
  "name": "Agora Subscriptions",
  "short_name": "Agora Admin",
  "start_url": "/subscription-admin",
  "scope": "/subscription-admin",
  "display": "standalone",
  "display_override": ["standalone"],
  "background_color": "#0A0D11",
  "theme_color": "#0A0D11",
  "prefer_related_applications": false,
  "icons": [
    {
      "src": "/subscription-admin-icon-192.png?v=6",
      "sizes": "192x192",
      "type": "image/png",
      "purpose": "any"
    },
    {
      "src": "/subscription-admin-icon-512.png?v=6",
      "sizes": "512x512",
      "type": "image/png",
      "purpose": "any"
    }
  ]
}
''')

          t = Path('test/subscriptionAdminMobileUi.test.js')
          x = t.read_text()
          x = x.replace('subscription-admin\\.webmanifest\\?v=3', 'subscription-admin\\.webmanifest\\?v=4')
          x = x.replace('  assert.doesNotMatch(output, /rel="apple-touch-icon"/);', '  assert.match(output, /apple-touch-icon\\.png\\?v=6/);')
          t.write_text(x)

          Path('test/subscriptionAdminWebAppManifest.test.js').write_text('''import assert from 'node:assert/strict';
import fs from 'node:fs';
import test from 'node:test';

test('subscription admin manifest requests standalone mode and PNG install icons', () => {
  const manifest = JSON.parse(fs.readFileSync('public/subscription-admin.webmanifest', 'utf8'));
  assert.equal(manifest.id, '/subscription-admin');
  assert.equal(manifest.start_url, '/subscription-admin');
  assert.equal(manifest.scope, '/subscription-admin');
  assert.equal(manifest.display, 'standalone');
  assert.deepEqual(manifest.display_override, ['standalone']);
  assert.deepEqual(manifest.icons, [
    {
      src: '/subscription-admin-icon-192.png?v=6',
      sizes: '192x192',
      type: 'image/png',
      purpose: 'any',
    },
    {
      src: '/subscription-admin-icon-512.png?v=6',
      sizes: '512x512',
      type: 'image/png',
      purpose: 'any',
    },
  ]);
  for (const icon of ['public/apple-touch-icon.png', 'public/subscription-admin-icon-192.png', 'public/subscription-admin-icon-512.png']) {
    const png = fs.readFileSync(icon);
    assert.equal(png.subarray(1, 4).toString('ascii'), 'PNG');
  }
});
''')
          PY
      - name: Install and validate
        run: |
          npm ci
          npm run check
          node --test test/subscriptionAdminMobileUi.test.js test/subscriptionAdminWebAppManifest.test.js test/subscriptionAdminHomeIcon.test.js
      - name: Commit implementation
        run: |
          rm -f .github/workflows/fix-subscription-admin-home-screen.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Fix iOS Home Screen install metadata'
          git push origin HEAD:main
