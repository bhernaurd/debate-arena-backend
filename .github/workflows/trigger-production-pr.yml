name: Trigger production PR CI registration

on:
  push:
    paths:
      - '.github/workflows/trigger-production-pr.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          rm .github/workflows/trigger-production-pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/trigger-production-pr.yml
          git commit -m 'Remove temporary production CI registration workflow'
          git push
