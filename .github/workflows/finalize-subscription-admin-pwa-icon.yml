name: Finalize subscription admin PWA icon

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/finalize-subscription-admin-pwa-icon.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Create simple admin icon
        run: |
          cat > public/subscription-admin-icon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Agora Admin">
            <rect width="512" height="512" rx="108" fill="#0A0D11"/>
            <g fill="#DDB65A">
              <path d="M105 208 256 116l151 92-14 23-137-83-137 83z"/>
              <rect x="119" y="220" width="274" height="20" rx="5"/>
              <rect x="142" y="257" width="56" height="18" rx="5"/>
              <rect x="154" y="275" width="32" height="112" rx="5"/>
              <rect x="142" y="387" width="56" height="18" rx="5"/>
              <rect x="228" y="257" width="56" height="18" rx="5"/>
              <rect x="240" y="275" width="32" height="112" rx="5"/>
              <rect x="228" y="387" width="56" height="18" rx="5"/>
              <rect x="314" y="257" width="56" height="18" rx="5"/>
              <rect x="326" y="275" width="32" height="112" rx="5"/>
              <rect x="314" y="387" width="56" height="18" rx="5"/>
              <rect x="122" y="416" width="268" height="20" rx="5"/>
            </g>
          </svg>
          SVG
      - name: Update web app metadata and tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/subscriptionAdminMobileUi.js')
          s = p.read_text()
          s = s.replace("background:url('/subscription-admin-icon.png?v=3') center/cover no-repeat", "background:url('/subscription-admin-icon.svg?v=5') center/cover no-repeat")
          s = s.replace("subscription-admin.webmanifest?v=1", "subscription-admin.webmanifest?v=3")
          s = s.replace(
              '.replaceAll(\n      \'<link rel="apple-touch-icon" sizes="180x180" href="/subscription-admin-icon.png?v=1" />\',\n      \'<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />\'\n    )',
              '.replaceAll(\n      \'<link rel="apple-touch-icon" sizes="180x180" href="/subscription-admin-icon.png?v=1" />\',\n      \'\'\n    )'
          )
          s = s.replace(
              '.replaceAll(\n      \'<link rel="icon" type="image/png" sizes="180x180" href="/subscription-admin-icon.png?v=1" />\',\n      \'<link rel="icon" type="image/png" sizes="180x180" href="/subscription-admin-icon.png?v=3" />\'\n    )',
              '.replaceAll(\n      \'<link rel="icon" type="image/png" sizes="180x180" href="/subscription-admin-icon.png?v=1" />\',\n      \'<link rel="icon" type="image/svg+xml" href="/subscription-admin-icon.svg?v=5" />\'\n    )'
          )
          anchor = '<meta name="apple-mobile-web-app-capable" content="yes" />'
          addition = anchor + '\\n  <meta name="mobile-web-app-capable" content="yes" />\\n  <meta name="application-name" content="Agora Admin" />'
          if addition not in s:
              if anchor not in s:
                  raise SystemExit('Expected mobile capability meta anchor not found')
              s = s.replace(anchor, addition)
          if "subscription-admin-icon.svg?v=5" not in s:
              raise SystemExit('Simple SVG icon was not wired into mobile UI')
          p.write_text(s)

          t = Path('test/subscriptionAdminMobileUi.test.js')
          x = t.read_text()
          x = x.replace('subscription-admin\\.webmanifest\\?v=1', 'subscription-admin\\.webmanifest\\?v=3')
          x = x.replace("  assert.match(output, /apple-touch-icon\\.png\\?v=3/);\n", "  assert.doesNotMatch(output, /rel=\"apple-touch-icon\"/);\n")
          x = x.replace("  assert.match(output, /subscription-admin-icon\\.png\\?v=3/);\n", "  assert.match(output, /subscription-admin-icon\\.svg\\?v=5/);\n")
          x = x.replace("  assert.match(output, /background:url\\('\\/subscription-admin-icon\\.png\\?v=3'\\) center\\/cover no-repeat/);\n", "  assert.match(output, /background:url\\('\\/subscription-admin-icon\\.svg\\?v=5'\\) center\\/cover no-repeat/);\n")
          marker = "  assert.match(output, /apple-mobile-web-app-capable/);\n"
          if 'assert.match(output, /mobile-web-app-capable/);' not in x:
              x = x.replace(marker, marker + "  assert.match(output, /mobile-web-app-capable/);\n  assert.match(output, /application-name/);\n")
          t.write_text(x)
          PY
          cat > public/subscription-admin.webmanifest <<'JSON'
          {
            "id": "/subscription-admin/",
            "name": "Agora Subscriptions",
            "short_name": "Agora Admin",
            "start_url": "/subscription-admin/",
            "scope": "/subscription-admin/",
            "display": "standalone",
            "display_override": ["standalone"],
            "background_color": "#0A0D11",
            "theme_color": "#0A0D11",
            "prefer_related_applications": false,
            "icons": [
              {
                "src": "/subscription-admin-icon.svg?v=5",
                "sizes": "any",
                "type": "image/svg+xml",
                "purpose": "any"
              }
            ]
          }
          JSON
          cat > test/subscriptionAdminWebAppManifest.test.js <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import test from 'node:test';

          test('subscription admin manifest requests standalone mode and dedicated SVG icon', () => {
            const manifest = JSON.parse(fs.readFileSync('public/subscription-admin.webmanifest', 'utf8'));
            assert.equal(manifest.start_url, '/subscription-admin/');
            assert.equal(manifest.scope, '/subscription-admin/');
            assert.equal(manifest.display, 'standalone');
            assert.deepEqual(manifest.display_override, ['standalone']);
            assert.deepEqual(manifest.icons, [{
              src: '/subscription-admin-icon.svg?v=5',
              sizes: 'any',
              type: 'image/svg+xml',
              purpose: 'any',
            }]);
            const svg = fs.readFileSync('public/subscription-admin-icon.svg', 'utf8');
            assert.match(svg, /<svg/);
            assert.match(svg, /Agora Admin/);
            assert.match(svg, /#DDB65A/);
          });
          JS
      - name: Install and validate
        run: |
          npm ci
          npm run check
          npm test
      - name: Commit implementation
        run: |
          rm -f .github/workflows/update-subscription-admin-pwa-icon.yml .github/workflows/retry-subscription-admin-pwa-icon.yml .github/workflows/finalize-subscription-admin-pwa-icon.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/subscription-admin-icon.svg public/subscription-admin.webmanifest lib/subscriptionAdminMobileUi.js test/subscriptionAdminMobileUi.test.js test/subscriptionAdminWebAppManifest.test.js .github/workflows/update-subscription-admin-pwa-icon.yml .github/workflows/retry-subscription-admin-pwa-icon.yml .github/workflows/finalize-subscription-admin-pwa-icon.yml
          git commit -m 'Use simple SVG icon for subscription admin web app'
          git push