name: Add daily account analytics

on:
  push:
    paths:
      - '.github/workflows/add-daily-account-analytics.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply daily account analytics patch
        run: python3 scripts/patchDailyAccountAnalytics.py
      - name: Install and validate
        run: |
          npm ci
          npm run check
          node --test test/subscriptionAdminOverviewContext.test.js
      - name: Commit implementation
        shell: bash
        run: |
          rm scripts/patchDailyAccountAnalytics.py
          rm .github/workflows/add-daily-account-analytics.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add subscriptionAdminDashboardRoutes.js lib/subscriptionAdminAccountsUi.js test/subscriptionAdminOverviewContext.test.js scripts/patchDailyAccountAnalytics.py .github/workflows/add-daily-account-analytics.yml
          git commit -m 'Add daily account acquisition analytics'
          git push
