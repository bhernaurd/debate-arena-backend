name: Apply verified multilingual backend patch

on:
  push:
    branches:
      - multilingual-8-languages
    paths:
      - .github/workflows/apply-multilingual.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and apply readable patches
        shell: bash
        run: |
          set -euo pipefail
          patches=(
            .multilingual_readable_patches/accountRankedDebateRoutes.js.patch
            .multilingual_readable_patches/dailyChallenge.js.patch
            .multilingual_readable_patches/lib_accountRankedDebateService.js.patch
            .multilingual_readable_patches/lib_accountRankedLadderService.js.patch
            .multilingual_readable_patches/lib_accountRankedPlacementService.js.patch
            .multilingual_readable_patches/ranked_profile_unified_engine.patch
            .multilingual_readable_patches/lib_rankedTopicGeneratorService.js.patch
            .multilingual_readable_patches/pushRoutes_part1.patch
            .multilingual_readable_patches/pushRoutes_part2.patch
            .multilingual_readable_patches/pushRoutes_part3.patch
            .multilingual_readable_patches/pushRoutes_part4.patch
            .multilingual_readable_patches/pushRoutes_part5.patch
            .multilingual_readable_patches/pushScheduler.js.patch
            .multilingual_readable_patches/questions.js.patch
          )
          for patch in "${patches[@]}"; do
            git apply --check "$patch"
            git apply "$patch"
          done

      - name: Verify exact final source blobs
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            local path="$1"
            local expected="$2"
            local actual
            actual="$(git hash-object "$path")"
            if [[ "$actual" != "$expected" ]]; then
              echo "Blob mismatch for $path: expected $expected, got $actual" >&2
              exit 1
            fi
          }
          check_blob accountRankedDebateRoutes.js 67e8edf2b08362de9d9994951d2df227bc9c993e
          check_blob questions.js 1d5fd6c869a2293058336df0c271eb7b13c5806f
          check_blob pushRoutes.js 451acb8252b482e21a3a7273b856638e75aeb1d2
          check_blob accountRankedLadderRoutes.js 0d3a516d5f08e9cb7505812a69db3294d65fb7c8
          check_blob accountRankedPlacementRoutes.js e7b82f638d0895c26b563a6b43c98b11e52fcccc
          check_blob pushScheduler.js 995ff3987c51d0de89ab4a0a1d149c84aa14bc11
          check_blob dailyChallenge.js 7308ad38b9183afae29e9fa594949cba5a952eb6
          check_blob migrations/032_multilingual_experience.sql bf1889bd18955a30c6b2fd15fc39063ff6be504c
          check_blob lib/accountRankedPlacementService.js 2addfee1feb16ea539cf0439f91e4822f0dc33e4
          check_blob lib/languageSupport.js 1ea09d546f6f8d1f0a9c1c40dc84cc70e9f4a959
          check_blob lib/rankedTopicGeneratorService.js dea00e2610798ce6a69e87f034a07c2f7631ddfc
          check_blob lib/rankedDebateEngineService.js 50fa4009d3a9545b5405bf4fc0289f88c4088a31
          check_blob lib/accountRankedProfileService.js aa2985a1b21e262e1c3e6a21d0e9bd352f0f9008
          check_blob lib/dailyChallengeLocalizationService.js fab6246d92df171ac60f98952d934cce216d4876
          check_blob lib/accountRankedLadderService.js dde0fd0a7d0df6e4dd2194724535fbb2e46a83b2
          check_blob lib/accountRankedUnifiedDebateService.js 8d31c2e686fc07c249c09451f3eacbf3dd67e71b
          check_blob lib/accountRankedDebateService.js 2ebeb1fb22d534500eeaa80518cefeb6f527f4d6

      - name: Install dependencies
        run: npm ci

      - name: Run backend checks
        run: npm run check

      - name: Run backend tests
        run: npm test

      - name: Commit verified source and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .multilingual_patch_chunks .multilingual_readable_patches
          rm -f .github/workflows/apply-multilingual.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add multilingual backend support"
          git push origin HEAD:multilingual-8-languages
