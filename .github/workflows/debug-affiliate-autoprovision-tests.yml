name: Debug affiliate autoprovision tests

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  debug:
    if: github.event.issue.title == '[automation] debug affiliate autoprovision tests'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Patch and test with diagnostics
        shell: bash
        run: |
          sed -n "/python3 <<'PY'/,/^          PY$/p" .github/workflows/affiliate-autoprovision-v2.yml \
            | tail -n +2 \
            | head -n -1 \
            | sed 's/^          //' > /tmp/affiliate_patch.py
          set +e
          : > /tmp/affiliate-test-debug.log
          python3 /tmp/affiliate_patch.py >> /tmp/affiliate-test-debug.log 2>&1
          echo "patch_exit=$?" >> /tmp/affiliate-test-debug.log
          npm ci >> /tmp/affiliate-test-debug.log 2>&1
          echo "npm_ci_exit=$?" >> /tmp/affiliate-test-debug.log
          npm run check >> /tmp/affiliate-test-debug.log 2>&1
          echo "check_exit=$?" >> /tmp/affiliate-test-debug.log
          node --test test/appStoreConnectAffiliateProvisioning.test.js >> /tmp/affiliate-test-debug.log 2>&1
          echo "focused_test_exit=$?" >> /tmp/affiliate-test-debug.log
          npm test >> /tmp/affiliate-test-debug.log 2>&1
          echo "full_test_exit=$?" >> /tmp/affiliate-test-debug.log
          set -e
          git reset --hard HEAD
          git clean -fd
          git checkout -B automation/affiliate-autoprovision-test-debug
          cp /tmp/affiliate-test-debug.log .affiliate-autoprovision-test-debug.log
          git config user.name "Agora Automation"
          git config user.email "actions@users.noreply.github.com"
          git add .affiliate-autoprovision-test-debug.log
          git commit -m "Capture affiliate autoprovision test diagnostics"
          git push --force origin HEAD:refs/heads/automation/affiliate-autoprovision-test-debug
