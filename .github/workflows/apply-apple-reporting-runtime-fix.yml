name: Apply Apple reporting runtime fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-apple-reporting-runtime-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: node scripts/patchAppleReportingRuntime.mjs
      - name: Install dependencies
        run: npm ci
      - name: Run syntax checks
        run: npm run check
      - name: Run automated tests
        run: npm test
      - name: Remove temporary patch files
        run: |
          rm scripts/patchAppleReportingRuntime.mjs
          rm .github/workflows/apply-apple-reporting-runtime-fix.yml
      - name: Commit final changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Apple reporting freshness sync"
          git push
# retry 2
