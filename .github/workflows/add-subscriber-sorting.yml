name: Add subscriber sorting

on:
  push:
    paths:
      - '.github/workflows/add-subscriber-sorting.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply subscriber sorting patch
        run: python3 .github/scripts/add_subscriber_sorting.py
      - name: Install and validate
        run: |
          npm ci
          npm run check
          npm test -- --test-name-pattern='Subscribers tab offers|customer API uses'
      - name: Commit implementation
        shell: bash
        run: |
          rm .github/workflows/add-subscriber-sorting.yml
          rm .github/scripts/add_subscriber_sorting.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add subscriptionAdminRoutes.js subscriptionAdminDashboardRoutes.js package.json lib/subscriptionAdminSubscribersUi.js test/subscriptionAdminSubscriberSorting.test.js .github/workflows/add-subscriber-sorting.yml .github/scripts/add_subscriber_sorting.py
          git commit -m 'Add subscriber sorting controls'
          git push
