name: Retry subscription admin PWA icon

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/retry-subscription-admin-pwa-icon.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install simpler admin icons
        shell: bash
        run: |
          cat > /tmp/admin180.b64 <<'B64'
          
          B64
          cat > /tmp/admin192.b64 <<'B64'
          
          B64
          cat > /tmp/admin512.b64 <<'B64'
          
          B64
          base64 -d /tmp/admin180.b64 > public/apple-touch-icon.png
          cp public/apple-touch-icon.png public/subscription-admin-icon.png
          base64 -d /tmp/admin192.b64 > public/subscription-admin-icon-192.png
          base64 -d /tmp/admin512.b64 > public/subscription-admin-icon-512.png
      - name: Harden web app metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/subscriptionAdminMobileUi.js')
          s = p.read_text()
          s = s.replace('subscription-admin-icon.png?v=3', 'subscription-admin-icon.png?v=4')
          s = s.replace('apple-touch-icon.png?v=3', 'apple-touch-icon.png?v=4')
          s = s.replace('subscription-admin.webmanifest?v=1', 'subscription-admin.webmanifest?v=2')
          anchor = '<meta name="apple-mobile-web-app-capable" content="yes" />'
          addition = anchor + '\\n  <meta name="mobile-web-app-capable" content="yes" />\\n  <meta name="application-name" content="Agora Admin" />'
          if addition not in s:
              if anchor not in s:
                  raise SystemExit('Expected mobile web app meta anchor not found')
              s = s.replace(anchor, addition)
          p.write_text(s)

          t = Path('test/subscriptionAdminMobileUi.test.js')
          x = t.read_text()
          x = x.replace('webmanifest\\?v=1', 'webmanifest\\?v=2')
          x = x.replace('v=3', 'v=4')
          marker = "  assert.match(output, /apple-mobile-web-app-capable/);\n"
          if 'assert.match(output, /mobile-web-app-capable/);' not in x:
              x = x.replace(marker, marker + "  assert.match(output, /mobile-web-app-capable/);\n  assert.match(output, /application-name/);\n")
          t.write_text(x)
          PY
          cat > public/subscription-admin.webmanifest <<'JSON'
          {
            "id": "/subscription-admin/",
            "name": "Agora Subscriptions",
            "short_name": "Agora Admin",
            "start_url": "/subscription-admin/",
            "scope": "/subscription-admin/",
            "display": "standalone",
            "display_override": ["standalone"],
            "background_color": "#0a0d11",
            "theme_color": "#0a0d11",
            "prefer_related_applications": false,
            "icons": [
              {
                "src": "/subscription-admin-icon-192.png?v=4",
                "sizes": "192x192",
                "type": "image/png",
                "purpose": "any"
              },
              {
                "src": "/subscription-admin-icon-512.png?v=4",
                "sizes": "512x512",
                "type": "image/png",
                "purpose": "any"
              }
            ]
          }
          JSON
          cat > test/subscriptionAdminWebAppManifest.test.js <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import test from 'node:test';

          function pngDimensions(buffer) {
            assert.equal(buffer.subarray(1, 4).toString('ascii'), 'PNG');
            return { width: buffer.readUInt32BE(16), height: buffer.readUInt32BE(20) };
          }

          test('subscription admin manifest is installable and uses dedicated icon sizes', () => {
            const manifest = JSON.parse(fs.readFileSync('public/subscription-admin.webmanifest', 'utf8'));
            assert.equal(manifest.start_url, '/subscription-admin/');
            assert.equal(manifest.scope, '/subscription-admin/');
            assert.equal(manifest.display, 'standalone');
            assert.deepEqual(manifest.display_override, ['standalone']);
            assert.deepEqual(manifest.icons.map(icon => icon.sizes), ['192x192', '512x512']);
            assert.deepEqual(manifest.icons.map(icon => icon.src), [
              '/subscription-admin-icon-192.png?v=4',
              '/subscription-admin-icon-512.png?v=4',
            ]);
            for (const [path, expected] of [
              ['public/apple-touch-icon.png', 180],
              ['public/subscription-admin-icon.png', 180],
              ['public/subscription-admin-icon-192.png', 192],
              ['public/subscription-admin-icon-512.png', 512],
            ]) {
              const { width, height } = pngDimensions(fs.readFileSync(path));
              assert.equal(width, expected);
              assert.equal(height, expected);
            }
          });
          JS
      - name: Install and validate
        run: |
          npm ci
          npm run check
          npm test
      - name: Commit implementation
        run: |
          rm -f .github/workflows/update-subscription-admin-pwa-icon.yml .github/workflows/retry-subscription-admin-pwa-icon.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/apple-touch-icon.png public/subscription-admin-icon.png public/subscription-admin-icon-192.png public/subscription-admin-icon-512.png public/subscription-admin.webmanifest lib/subscriptionAdminMobileUi.js test/subscriptionAdminMobileUi.test.js test/subscriptionAdminWebAppManifest.test.js .github/workflows/update-subscription-admin-pwa-icon.yml .github/workflows/retry-subscription-admin-pwa-icon.yml
          git commit -m 'Simplify subscription admin web app icon'
          git push