name: Cleanup Affiliate Delete V2 Branch

on:
  push:
    branches:
      - affiliate-delete-v2-work
    paths:
      - .affiliate-delete-v2-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: affiliate-delete-v2-work
          fetch-depth: 0
      - name: Restore unrelated tracked lockfile and remove cleanup files
        run: |
          git fetch origin main
          git checkout origin/main -- node_modules/.package-lock.json
          rm -f .github/workflows/cleanup-affiliate-delete-v2.yml
          rm -f .affiliate-delete-v2-cleanup
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean affiliate delete v2 branch"
          git push origin HEAD:affiliate-delete-v2-work
