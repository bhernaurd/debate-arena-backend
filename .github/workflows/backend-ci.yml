name: Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run syntax checks
        run: npm run check

      - name: Test Google Play verifier
        run: node --test test/googlePlaySubscriptionService.test.js

      - name: Test Google Play route authenticated sync
        run: node --test --test-name-pattern="authenticated and binds" test/googlePlaySubscriptionRoutes.test.js

      - name: Test Google Play route missing auth
        run: node --test --test-name-pattern="without Agora bearer" test/googlePlaySubscriptionRoutes.test.js

      - name: Test Google Play route account spoof protection
        run: node --test --test-name-pattern="client-supplied account" test/googlePlaySubscriptionRoutes.test.js

      - name: Test unified account Pro access
        run: node --test test/accountProAccessService.test.js test/accountProAccessGooglePlay.test.js

      - name: Test account authentication integration
        run: node --test test/accountAuthRoutes.test.js test/accountAuthServer.test.js

      - name: Test authenticated Android AI jobs
        run: node --test test/accountAIJobRoutes.test.js

      - name: Run automated tests
        run: npm test
