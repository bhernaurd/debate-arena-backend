name: Geography migration dependency fix

on:
  push:
    branches:
      - fix/geography-no-migration-dependency
    paths:
      - '.github/workflows/geography-no-migration-dependency.yml'
      - 'scripts/patchGeographyNoMigrationDependency.py'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply safe geography patch
        run: python3 scripts/patchGeographyNoMigrationDependency.py
      - name: Install and validate
        run: |
          npm ci
          npm run check
          node --check analytics.js
          node --test test/subscriptionAdminAccountUsageGeography.test.js test/subscriptionAdminAccountActivity.test.js test/subscriptionAdminOverviewContext.test.js test/subscriptionAdminMobileUi.test.js
      - name: Commit tested fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analytics.js subscriptionAdminDashboardRoutes.js test/subscriptionAdminAccountUsageGeography.test.js
          git rm scripts/patchGeographyNoMigrationDependency.py .github/workflows/geography-no-migration-dependency.yml
          git commit -m 'Remove geography migration runtime dependency'
          git push origin HEAD:fix/geography-no-migration-dependency
