name: One-time Apple payout overview update

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'Run one-time Apple payout dashboard update'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Add Apple payout calendar and overview UI
        shell: bash
        run: |
          cat > lib/appleFiscalCalendar.js <<'EOF'
          const TIME_ZONE = 'America/Chicago';

          // Planning estimates for Apple's 2026 fiscal periods. Apple does not
          // publish a guaranteed payment-date calendar; the dashboard labels
          // these dates as estimates and keeps imported financial settlements
          // as the source of truth for final proceeds.
          const APPLE_FISCAL_PERIODS = Object.freeze([
            { fiscalMonth: '2026-01', periodStart: '2025-12-28', periodEnd: '2026-01-31', estimatedPaymentDate: '2026-03-05' },
            { fiscalMonth: '2026-02', periodStart: '2026-02-01', periodEnd: '2026-02-28', estimatedPaymentDate: '2026-04-02' },
            { fiscalMonth: '2026-03', periodStart: '2026-03-01', periodEnd: '2026-03-28', estimatedPaymentDate: '2026-04-30' },
            { fiscalMonth: '2026-04', periodStart: '2026-03-29', periodEnd: '2026-05-02', estimatedPaymentDate: '2026-06-04' },
            { fiscalMonth: '2026-05', periodStart: '2026-05-03', periodEnd: '2026-05-30', estimatedPaymentDate: '2026-07-02' },
            { fiscalMonth: '2026-06', periodStart: '2026-05-31', periodEnd: '2026-06-27', estimatedPaymentDate: '2026-07-30' },
            { fiscalMonth: '2026-07', periodStart: '2026-06-28', periodEnd: '2026-08-01', estimatedPaymentDate: '2026-09-03' },
            { fiscalMonth: '2026-08', periodStart: '2026-08-02', periodEnd: '2026-08-29', estimatedPaymentDate: '2026-10-01' },
            { fiscalMonth: '2026-09', periodStart: '2026-08-30', periodEnd: '2026-09-26', estimatedPaymentDate: '2026-10-29' },
            { fiscalMonth: '2026-10', periodStart: '2026-09-27', periodEnd: '2026-10-31', estimatedPaymentDate: '2026-12-03' },
            { fiscalMonth: '2026-11', periodStart: '2026-11-01', periodEnd: '2026-11-28', estimatedPaymentDate: '2026-12-31' },
            { fiscalMonth: '2026-12', periodStart: '2026-11-29', periodEnd: '2026-12-26', estimatedPaymentDate: '2027-01-28' },
          ]);

          function dateKeyInTimeZone(value = new Date()) {
            const date = value instanceof Date ? value : new Date(value);
            if (Number.isNaN(date.getTime())) return null;
            const parts = new Intl.DateTimeFormat('en-US', {
              timeZone: TIME_ZONE,
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
            }).formatToParts(date);
            const year = parts.find((part) => part.type === 'year')?.value;
            const month = parts.find((part) => part.type === 'month')?.value;
            const day = parts.find((part) => part.type === 'day')?.value;
            return year && month && day ? `${year}-${month}-${day}` : null;
          }

          export function getAppleFiscalPayoutCalendar({ asOf = new Date(), limit = 7 } = {}) {
            const today = dateKeyInTimeZone(asOf) || new Date().toISOString().slice(0, 10);
            const periods = APPLE_FISCAL_PERIODS.map((period) => ({ ...period }));
            const current = periods.find(
              (period) => period.periodStart <= today && today <= period.periodEnd
            ) || null;
            const nextPayoutIndex = periods.findIndex(
              (period) => period.estimatedPaymentDate >= today
            );
            const nextPayout = nextPayoutIndex >= 0 ? periods[nextPayoutIndex] : null;
            const safeLimit = Math.max(1, Math.min(12, Number(limit) || 7));
            const startIndex = nextPayoutIndex >= 0
              ? Math.max(0, nextPayoutIndex - 1)
              : Math.max(0, periods.length - safeLimit);

            return {
              asOf: today,
              timeZone: TIME_ZONE,
              source: 'planning_estimate',
              isEstimated: true,
              paymentRule: 'Apple states payments are made within 45 days after the last day of the fiscal month; exact issue and bank dates can vary.',
              current,
              nextPayout,
              periods: periods.slice(startIndex, startIndex + safeLimit),
            };
          }

          export default getAppleFiscalPayoutCalendar;
          EOF

          cat > test/appleFiscalCalendar.test.js <<'EOF'
          import assert from 'node:assert/strict';
          import test from 'node:test';

          import { getAppleFiscalPayoutCalendar } from '../lib/appleFiscalCalendar.js';

          test('Apple payout calendar identifies the Aug 2026 fiscal period and next expected payout', () => {
            const calendar = getAppleFiscalPayoutCalendar({
              asOf: new Date('2026-08-24T17:00:00Z'),
              limit: 7,
            });

            assert.equal(calendar.current?.fiscalMonth, '2026-08');
            assert.equal(calendar.current?.periodStart, '2026-08-02');
            assert.equal(calendar.current?.periodEnd, '2026-08-29');
            assert.equal(calendar.current?.estimatedPaymentDate, '2026-10-01');
            assert.equal(calendar.nextPayout?.fiscalMonth, '2026-07');
            assert.equal(calendar.nextPayout?.estimatedPaymentDate, '2026-09-03');
            assert.equal(calendar.isEstimated, true);
          });
          EOF

          python3 <<'PY'
          from pathlib import Path

          service = Path('lib/subscriptionAdminHistoryService.js')
          source = service.read_text()
          import_anchor = "const HISTORY_TIME_ZONE = 'America/Chicago';"
          import_text = "import { getAppleFiscalPayoutCalendar } from './appleFiscalCalendar.js';\n\n" + import_anchor
          if source.count(import_anchor) != 1:
              raise SystemExit(f'Expected one history service import anchor, found {source.count(import_anchor)}')
          source = source.replace(import_anchor, import_text, 1)

          return_anchor = "    financialPeriods,\n  };"
          return_text = "    financialPeriods,\n    payoutCalendar: getAppleFiscalPayoutCalendar(),\n  };"
          if source.count(return_anchor) != 1:
              raise SystemExit(f'Expected one history service return anchor, found {source.count(return_anchor)}')
          service.write_text(source.replace(return_anchor, return_text, 1))

          ui = Path('lib/subscriptionAdminHistoryUi.js')
          source = ui.read_text()
          old_tail = r'''    .replace(
      `qs('#eventFilterButton').addEventListener('click',loadEvents);`,
      `qs('#historyPeriod').addEventListener('change',renderHistoryPeriod);\n  qs('#eventFilterButton').addEventListener('click',loadEvents);`
    );'''
          new_tail = r'''    .replace(
      `qs('#eventFilterButton').addEventListener('click',loadEvents);`,
      `qs('#historyPeriod').addEventListener('change',renderHistoryPeriod);\n  qs('#eventFilterButton').addEventListener('click',loadEvents);`
    )
    .replace(
      `<div class="section"><div class="sectionhead"><h2>Recent customers</h2><span>Latest subscription activity</span></div><div class="tablewrap" id="recentCustomers"></div></div>`,
      `<div class="section apple-payout-section">\n        <div class="sectionhead"><h2>Apple payout periods</h2><span>Apple fiscal calendar · estimated payout dates</span></div>\n        <div class="apple-payout-summary" id="applePayoutSummary"><div class="loading">Loading payout periods...</div></div>\n        <div class="tablewrap" id="applePayoutCalendar"></div>\n      </div>\n      <div class="section"><div class="sectionhead"><h2>Recent customers</h2><span>Latest subscription activity</span></div><div class="tablewrap" id="recentCustomers"></div></div>`
    )
    .replace(
      `.history-toolbar { align-items:center; }`,
      `.apple-payout-summary { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:16px 18px 4px; }\n    .apple-payout-card { border:1px solid var(--line);background:#0e1015;border-radius:13px;padding:14px;min-width:0; }\n    .apple-payout-card .label { color:var(--muted);font-size:11px;margin-bottom:7px; }\n    .apple-payout-card .value { color:#f3f1eb;font-size:18px;font-weight:760;letter-spacing:-.02em; }\n    .apple-payout-card .hint { color:#777f8d;font-size:11px;line-height:1.4;margin-top:5px; }\n    .apple-payout-date { color:#f2d58a;font-weight:780;white-space:nowrap; }\n    .apple-payout-final { color:#91e5b8;font-weight:750;white-space:nowrap; }\n    .apple-payout-note { color:var(--muted);font-size:11px;line-height:1.45;padding:10px 18px 14px; }\n    @media (max-width:1000px){ .apple-payout-summary{grid-template-columns:1fr} }\n    .history-toolbar { align-items:center; }`
    )
    .replace(
      `  function eventParams(){`,
      `  function payoutDateLabel(v){ if(!v)return 'N/A'; const d=new Date(v+'T12:00:00Z'); if(Number.isNaN(d.getTime()))return String(v); return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'}); }\n  function payoutPeriodLabel(r){ if(!r)return 'N/A'; return payoutDateLabel(r.periodStart)+' – '+payoutDateLabel(r.periodEnd); }\n  function payoutFinalPeriod(h,row){ return (h?.financialPeriods||[]).find(period=>String(period.reportDate||'')===String(row?.fiscalMonth||''))||null; }\n  function payoutStatus(h,row){\n    const final=payoutFinalPeriod(h,row); if(final)return '<span class="pill good">Final</span>';\n    const today=String(h?.payoutCalendar?.asOf||new Date().toISOString().slice(0,10));\n    if(row?.periodStart<=today && today<=row?.periodEnd)return '<span class="pill warn">Current sales</span>';\n    if(String(row?.fiscalMonth||'')===String(h?.payoutCalendar?.nextPayout?.fiscalMonth||''))return '<span class="pill warn">Next payout</span>';\n    if(row?.estimatedPaymentDate>=today)return '<span class="pill">Upcoming</span>';\n    return '<span class="pill">Past estimate</span>';\n  }\n  function payoutFinalMoney(h,row){ const final=payoutFinalPeriod(h,row); if(!final)return '<span class="history-pending">Pending</span>'; return '<span class="apple-payout-final">'+esc(historyMoneyBag(final.finalProceeds||{}))+'</span>'; }\n  function renderApplePayoutCalendar(h){\n    const summary=qs('#applePayoutSummary'), table=qs('#applePayoutCalendar'); if(!summary||!table)return;\n    const calendar=h?.payoutCalendar;\n    if(!calendar){ summary.innerHTML='<div class="empty">Payout calendar unavailable.</div>'; table.innerHTML=''; return; }\n    const next=calendar.nextPayout, current=calendar.current;\n    summary.innerHTML=[\n      '<div class="apple-payout-card"><div class="label">Next expected payout</div><div class="value apple-payout-date">'+esc(next?payoutDateLabel(next.estimatedPaymentDate):'N/A')+'</div><div class="hint">'+esc(next?historyMonthLabel(next.fiscalMonth)+' · sales '+payoutPeriodLabel(next):'No upcoming period in calendar')+'</div></div>',\n      '<div class="apple-payout-card"><div class="label">Current Apple fiscal period</div><div class="value">'+esc(current?historyMonthLabel(current.fiscalMonth):'Between periods')+'</div><div class="hint">'+esc(current?payoutPeriodLabel(current)+(current.estimatedPaymentDate?' · est. payout '+payoutDateLabel(current.estimatedPaymentDate):''):'Apple fiscal period not found')+'</div></div>',\n      '<div class="apple-payout-card"><div class="label">Apple payment rule</div><div class="value">Within 45 days</div><div class="hint">After the fiscal month closes. Exact issue and bank dates can vary.</div></div>'\n    ].join('');\n    const rows=calendar.periods||[];\n    table.innerHTML=rows.length?'<table><thead><tr><th>Fiscal month</th><th>Sales period</th><th>Estimated payout</th><th>Status</th><th>Final proceeds</th></tr></thead><tbody>'+rows.map(row=>'<tr><td><strong>'+esc(historyMonthLabel(row.fiscalMonth))+'</strong></td><td>'+esc(payoutPeriodLabel(row))+'</td><td><span class="apple-payout-date">'+esc(payoutDateLabel(row.estimatedPaymentDate))+'</span></td><td>'+payoutStatus(h,row)+'</td><td>'+payoutFinalMoney(h,row)+'</td></tr>').join('')+'</tbody></table>':'<div class="empty">No payout periods available.</div>';\n    const note=document.createElement('div'); note.className='apple-payout-note'; note.textContent='Estimated payout dates are for planning only. Final proceeds come from imported Apple financial reports and remain the source of truth.'; table.parentNode?.appendChild(note);\n  }\n  function eventParams(){`
    )
    .replace(
      `qs('#recentCustomers').innerHTML=customerTable(d.recentCustomers||[]); bindCustomerRows(qs('#recentCustomers'));`,
      `renderApplePayoutCalendar(h);\n      qs('#recentCustomers').innerHTML=customerTable(d.recentCustomers||[]); bindCustomerRows(qs('#recentCustomers'));`
    );'''
          count = source.count(old_tail)
          if count != 1:
              raise SystemExit(f'Expected one history UI tail anchor, found {count}')
          ui.write_text(source.replace(old_tail, new_tail, 1))

          package = Path('package.json')
          source = package.read_text()
          anchor = 'node --check lib/subscriptionAdminHistoryUi.js && node --check lib/appStoreConnectReportsService.js'
          replacement = 'node --check lib/subscriptionAdminHistoryUi.js && node --check lib/appleFiscalCalendar.js && node --check lib/appStoreConnectReportsService.js'
          if source.count(anchor) != 1:
              raise SystemExit(f'Expected one package check anchor, found {source.count(anchor)}')
          package.write_text(source.replace(anchor, replacement, 1))
          PY

          rm -f .github/workflows/one-time-add-apple-payout-overview.yml

          node --test test/appleFiscalCalendar.test.js
          npm run check
          npm test

      - name: Commit dashboard update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show Apple payout periods on subscription overview"
          git push origin HEAD:main
