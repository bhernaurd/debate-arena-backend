name: One-time Apple payout dashboard wiring

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  wire-dashboard:
    if: ${{ github.event.head_commit.message == 'Run one-time Apple payout dashboard wiring' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply dashboard wiring
        run: python3 scripts/applyApplePayoutOverview.py

      - name: Verify backend
        run: |
          node --test test/appleFiscalCalendar.test.js
          npm run check
          npm test

      - name: Commit verified update
        run: |
          rm -f scripts/applyApplePayoutOverview.py
          rm -f .github/workflows/one-time-add-apple-payout-overview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show Apple payout periods on subscription overview"
          git push origin HEAD:main
