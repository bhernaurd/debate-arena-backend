name: Apply Affiliate Delete V2

on:
  push:
    branches:
      - affiliate-delete-v2-work
    paths:
      - .affiliate-delete-v2-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out work branch
        uses: actions/checkout@v4
        with:
          ref: affiliate-delete-v2-work
          fetch-depth: 0

      - name: Apply isolated delete patch
        run: python3 scripts/applyAffiliateDeleteV2.py

      - name: Validate backend and delete feature
        run: |
          node --check affiliateRoutes.js
          node --check lib/appStoreConnectAffiliateService.js
          npm ci
          npm run check
          npm test

      - name: Remove one-time patch machinery
        run: |
          rm -f scripts/applyAffiliateDeleteV2.py
          rm -f .github/workflows/apply-affiliate-delete-v2.yml
          rm -f .affiliate-delete-v2-trigger

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add isolated affiliate delete control"
          git push origin HEAD:affiliate-delete-v2-work
