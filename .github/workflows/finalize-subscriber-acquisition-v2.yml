name: Finalize subscriber acquisition dashboard v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-subscriber-acquisition-v2.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Add first-time subscriber acquisition metric
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/subscriptionAdminHistoryService.js')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "    newPaidSubscribers: 0,\n    trialStarts: 0,",
              "    newSubscribers: 0,\n    newPaidSubscribers: 0,\n    trialStarts: 0,",
              'empty month new subscribers'
          )
          replace_once(
              "    paidCustomers: 0,\n    trialStarts: 0,",
              "    paidCustomers: 0,\n    newSubscribers: 0,\n    trialStarts: 0,",
              'all-time new subscribers'
          )
          replace_once(
              "    allTime.paidCustomers += numberValue(month.newPaidSubscribers);\n    allTime.trialStarts += numberValue(month.trialStarts);",
              "    allTime.paidCustomers += numberValue(month.newPaidSubscribers);\n    allTime.newSubscribers += numberValue(month.newSubscribers);\n    allTime.trialStarts += numberValue(month.trialStarts);",
              'sum all-time new subscribers'
          )
          replace_once(
              "      first_paid AS (\n        SELECT DISTINCT ON (customer_key)\n          customer_key,\n          purchase_date AS fact_at\n        FROM transaction_facts\n        WHERE purchase_date IS NOT NULL\n          AND is_trial = FALSE\n          AND price_milliunits IS NOT NULL\n          AND price_milliunits > 0\n        ORDER BY customer_key, purchase_date ASC, signed_date ASC NULLS LAST, transaction_id ASC\n      ),\n      first_trial AS (\n        SELECT DISTINCT ON (customer_key)\n          customer_key,\n          purchase_date AS fact_at\n        FROM transaction_facts\n        WHERE purchase_date IS NOT NULL\n          AND is_trial = TRUE\n        ORDER BY customer_key, purchase_date ASC, signed_date ASC NULLS LAST, transaction_id ASC\n      ),",
              "      first_relationship AS (\n        SELECT DISTINCT ON (customer_key)\n          customer_key,\n          purchase_date AS fact_at\n        FROM transaction_facts\n        WHERE purchase_date IS NOT NULL\n          AND product_id IN ('agora_pro_monthly', 'agora_pro_yearly')\n        ORDER BY customer_key, purchase_date ASC, signed_date ASC NULLS LAST, transaction_id ASC\n      ),\n      first_paid AS (\n        SELECT DISTINCT ON (customer_key)\n          customer_key,\n          purchase_date AS fact_at\n        FROM transaction_facts\n        WHERE purchase_date IS NOT NULL\n          AND product_id IN ('agora_pro_monthly', 'agora_pro_yearly')\n          AND is_trial = FALSE\n          AND price_milliunits IS NOT NULL\n          AND price_milliunits > 0\n        ORDER BY customer_key, purchase_date ASC, signed_date ASC NULLS LAST, transaction_id ASC\n      ),\n      first_trial AS (\n        SELECT DISTINCT ON (customer_key)\n          customer_key,\n          purchase_date AS fact_at\n        FROM transaction_facts\n        WHERE purchase_date IS NOT NULL\n          AND product_id IN ('agora_pro_monthly', 'agora_pro_yearly')\n          AND is_trial = TRUE\n        ORDER BY customer_key, purchase_date ASC, signed_date ASC NULLS LAST, transaction_id ASC\n      ),",
              'first recurring relationship CTE'
          )
          replace_once(
              "      facts AS (\n        SELECT fact_at, 'new_paid'::text AS kind FROM first_paid\n        UNION ALL\n        SELECT fact_at, 'trial_start'::text FROM first_trial",
              "      facts AS (\n        SELECT fact_at, 'new_subscriber'::text AS kind FROM first_relationship\n        UNION ALL\n        SELECT fact_at, 'new_paid'::text FROM first_paid\n        UNION ALL\n        SELECT fact_at, 'trial_start'::text FROM first_trial",
              'new subscriber fact'
          )
          replace_once(
              "        COUNT(*) FILTER (WHERE kind = 'new_paid')::int AS new_paid_subscribers,\n        COUNT(*) FILTER (WHERE kind = 'trial_start')::int AS trial_starts,",
              "        COUNT(*) FILTER (WHERE kind = 'new_subscriber')::int AS new_subscribers,\n        COUNT(*) FILTER (WHERE kind = 'new_paid')::int AS new_paid_subscribers,\n        COUNT(*) FILTER (WHERE kind = 'trial_start')::int AS trial_starts,",
              'monthly new subscriber count'
          )
          replace_once(
              "    month.newPaidSubscribers += numberValue(row.new_paid_subscribers);\n    month.trialStarts += numberValue(row.trial_starts);",
              "    month.newSubscribers += numberValue(row.new_subscribers);\n    month.newPaidSubscribers += numberValue(row.new_paid_subscribers);\n    month.trialStarts += numberValue(row.trial_starts);",
              'assign monthly new subscribers'
          )

          path.write_text(text)
          PY

      - name: Update Overview card and acquisition graph
        run: |
          cat > lib/subscriptionAdminLifetimeUi.js <<'EOF'
          export function enhanceSubscriptionAdminLifetimeHtml(html) {
            let output = String(html);

            output = output
              .replace(
                "metric('Active Pro',m.active_pro_entitlements||0,'All production Pro entitlements')",
                "metric('Active subscriptions',Math.max(0,Number(m.active_pro_entitlements||0)-Number(m.active_lifetime_pro||0)),Number(m.active_paid_subscribers||0)+' paid · '+Number(m.active_trials||0)+' trial'+(Number(m.active_trials||0)===1?'':'s'))"
              )
              .replace(
                "metric('Paid subscribers',m.active_paid_subscribers||0,'Monthly + annual, excluding trials'),",
                "metric('Paid subscribers',m.active_paid_subscribers||0,'Monthly + annual, excluding trials'),\n        metric('Free trials',m.active_trials||0,'Active free-trial subscribers'),"
              )
              .replace(
                '.grid { display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px; }',
                '.grid { display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px; }\n    #metrics { grid-template-columns:repeat(5,minmax(0,1fr)); }\n    @media (max-width:1200px){ #metrics{grid-template-columns:repeat(3,1fr)} }\n    @media (max-width:760px){ #metrics{grid-template-columns:1fr 1fr} }'
              )
              .replaceAll('activeProAtMonthEnd', 'activeSubscriptionsAtMonthEnd')
              .replace(
                "metric('Total subscribers',m.active_pro_entitlements||0,'All active production Pro access')",
                "metric('Active subscriptions',Math.max(0,Number(m.active_pro_entitlements||0)-Number(m.active_lifetime_pro||0)),'Monthly + annual subscriptions and trials')"
              )
              .replace(
                "metric('Total subscribers',row.activeSubscriptionsAtMonthEnd==null?'N/A':row.activeSubscriptionsAtMonthEnd,'Active Pro at the end of '+subscriberMonthLabel(row.month))",
                "metric('Active subscriptions',row.activeSubscriptionsAtMonthEnd==null?'N/A':row.activeSubscriptionsAtMonthEnd,'Monthly + annual subscriptions active at the end of '+subscriberMonthLabel(row.month))"
              )
              .replaceAll('<th>Active Pro at end</th>', '<th>Active subscriptions at end</th>')
              .replaceAll('month-end subscriber total.', 'month-end subscription total.');

            output = output.replace(
              /<h2>(?:Subscriber growth|Active Pro growth|Active subscription growth)<\/h2><span id="breakdownChartSummary">[^<]*<\/span>/,
              '<h2>New subscribers by month</h2><span id="breakdownChartSummary">First-time subscription starts</span>'
            );

            output = output
              .replaceAll('Loading subscriber growth...', 'Loading new subscriber acquisition...')
              .replaceAll('Loading Active Pro growth...', 'Loading new subscriber acquisition...')
              .replaceAll('Loading subscription growth...', 'Loading new subscriber acquisition...')
              .replaceAll('No subscriber growth history yet.', 'No new subscriber history yet.')
              .replaceAll('No Active Pro history yet.', 'No new subscriber history yet.')
              .replaceAll('No subscription history yet.', 'No new subscriber history yet.');

            output = output.replace(
              /  function breakdownGrowthRows\(\)\{[\s\S]*?\n  \}\n  function renderSubscriberGrowthChart\(selected='current'\)\{[\s\S]*?\n  \}\n  function breakdownHistoryTable/,
              `  function breakdownGrowthRows(){\n    if(!breakdownData)return [];\n    return [...(breakdownData.history?.months||[])]\n      .sort((a,b)=>String(a.month).localeCompare(String(b.month)))\n      .map(row=>({month:row.month,value:Number(row.newSubscribers||0)}))\n      .filter(row=>row.month&&Number.isFinite(row.value));\n  }\n  function renderSubscriberGrowthChart(selected='current'){\n    const el=qs('#breakdownChart'), summary=qs('#breakdownChartSummary');\n    if(!el||!summary||!breakdownData)return;\n    const rows=breakdownGrowthRows();\n    if(!rows.length){ el.innerHTML='<div class="empty">No new subscriber history yet.</div>'; summary.textContent='First-time subscription starts'; return; }\n    const currentMonth=breakdownData.history?.currentMonth;\n    const selectedMonth=selected==='current'?currentMonth:selected;\n    const width=900,height=270,left=54,right=22,top=24,bottom=48;\n    const plotWidth=width-left-right,plotHeight=height-top-bottom,baseY=top+plotHeight;\n    const maxValue=Math.max(1,...rows.map(row=>row.value));\n    const slotWidth=plotWidth/Math.max(1,rows.length);\n    const barWidth=Math.max(28,Math.min(96,slotWidth*.56));\n    const xAt=index=>left+slotWidth*(index+.5);\n    const yAt=value=>top+plotHeight-(value/maxValue)*plotHeight;\n    const tickCount=Math.max(1,Math.min(5,maxValue));\n    const grid=Array.from({length:tickCount+1},(_,index)=>{ const value=Math.round(maxValue*index/tickCount); const y=yAt(value); return '<line x1="'+left+'" y1="'+y.toFixed(1)+'" x2="'+(width-right)+'" y2="'+y.toFixed(1)+'" stroke="#242832" stroke-width="1"/><text x="'+(left-10)+'" y="'+(y+4).toFixed(1)+'" fill="#737b89" font-size="11" text-anchor="end">'+esc(value)+'</text>'; }).join('');\n    const bars=rows.map((row,index)=>{ const x=xAt(index),y=yAt(row.value),active=row.month===selectedMonth,barHeight=Math.max(0,baseY-y); return '<g><rect x="'+(x-barWidth/2).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+barWidth.toFixed(1)+'" height="'+barHeight.toFixed(1)+'" rx="7" fill="'+(active?'#f0cf79':'#d4b566')+'" opacity="'+(active?'1':'.82')+'"><title>'+esc(subscriberMonthLabel(row.month)+': '+row.value+' new subscriber'+(row.value===1?'':'s'))+'</title></rect><text x="'+x.toFixed(1)+'" y="'+Math.max(14,y-9).toFixed(1)+'" fill="'+(active?'#f3f1eb':'#aeb4be')+'" font-size="11" font-weight="700" text-anchor="middle">'+esc(row.value)+'</text><text x="'+x.toFixed(1)+'" y="'+(height-17)+'" fill="'+(active?'#f3f1eb':'#737b89')+'" font-size="11" text-anchor="middle">'+esc(subscriberMonthShortLabel(row.month))+'</text></g>'; }).join('');\n    el.innerHTML='<svg role="img" aria-label="New subscribers by month" viewBox="0 0 '+width+' '+height+'" style="display:block;width:100%;min-width:680px;height:auto">'+grid+bars+'</svg>';\n    const focused=rows.find(row=>row.month===selectedMonth)||rows[rows.length-1];\n    summary.textContent=focused.value+' new subscriber'+(focused.value===1?'':'s')+' in '+subscriberMonthShortLabel(focused.month);\n  }\n  function breakdownHistoryTable`
            );

            output = output
              .replace(
                '<th>Month</th><th>Active subscriptions at end</th>',
                '<th>Month</th><th>New subscribers</th><th>Active subscriptions at end</th>'
              )
              .replace(
                "+'</span></td><td>'+esc(r.activeSubscriptionsAtMonthEnd==null?",
                "+'</span></td><td>'+esc(r.newSubscribers||0)+'</td><td>'+esc(r.activeSubscriptionsAtMonthEnd==null?"
              );

            return output;
          }

          export default enhanceSubscriptionAdminLifetimeHtml;
          EOF

      - name: Update dashboard tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('test/subscriptionAdminOverviewUi.test.js')
          t = p.read_text()
          t = t.replace("test('Overview separates Lifetime Pro from active subscriptions'", "test('Overview shows free trials instead of Lifetime Pro'")
          t = t.replace("  assert.match(loadOverview, /metric\\('Lifetime Pro'/);\n  assert.doesNotMatch(loadOverview, /metric\\('Lifetime'/);", "  assert.match(loadOverview, /metric\\('Free trials'/);\n  assert.doesNotMatch(loadOverview, /metric\\('Lifetime Pro'/);\n  assert.doesNotMatch(loadOverview, /metric\\('Lifetime'/);")
          t = t.replace("  assert.match(breakdown, /<h2>Subscriber growth<\\/h2>/);", "  assert.match(breakdown, /<h2>New subscribers by month<\\/h2>/);")
          t = t.replace("  assert.match(html, /activeSubscriptionsAtMonthEnd/);\n  assert.match(html, /active_pro_entitlements/);\n  assert.match(html, /Subscriber growth by month/);", "  assert.match(html, /newSubscribers/);\n  assert.match(html, /activeSubscriptionsAtMonthEnd/);\n  assert.match(html, /New subscribers by month/);\n  assert.match(html, /<rect/);\n  assert.doesNotMatch(html, /Subscriber growth by month/);")
          p.write_text(t)

          p = Path('test/subscriptionAdminRevenueUi.test.js')
          t = p.read_text()
          t = t.replace("test('Subscriber Analytics separates recurring subscriptions from Lifetime Pro'", "test('Subscriber Analytics shows monthly acquisition and keeps Lifetime out of Overview'")
          t = t.replace("  assert.match(breakdown, /<h2>Active subscription growth<\\/h2>/);\n  assert.match(breakdown, /id=\"breakdownChartSummary\">Subscriptions over time<\\/span>/);", "  assert.match(breakdown, /<h2>New subscribers by month<\\/h2>/);\n  assert.match(breakdown, /id=\"breakdownChartSummary\">First-time subscription starts<\\/span>/);\n  assert.match(html, /New subscribers by month/);\n  assert.match(html, /row\\.newSubscribers/);")
          p.write_text(t)

          p = Path('test/subscriptionAdminLifetimeSeparation.test.js')
          t = p.read_text().rstrip() + "\n\ntest('history counts each recurring customer once in the month their relationship begins', () => {\n  const source = fs.readFileSync(new URL('../lib/subscriptionAdminHistoryService.js', import.meta.url), 'utf8');\n  assert.match(source, /first_relationship AS/);\n  assert.match(source, /'new_subscriber'::text AS kind FROM first_relationship/);\n  assert.match(source, /AS new_subscribers/);\n  assert.match(source, /month\\.newSubscribers \\+= numberValue\\(row\\.new_subscribers\\)/);\n});\n"
          p.write_text(t)
          PY

      - run: npm ci
      - name: Targeted dashboard tests
        run: node --test test/subscriptionAdminOverviewUi.test.js test/subscriptionAdminRevenueUi.test.js test/subscriptionAdminLifetimeSeparation.test.js
      - name: Syntax checks
        run: npm run check
      - name: Commit acquisition dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/subscriptionAdminHistoryService.js lib/subscriptionAdminLifetimeUi.js test/subscriptionAdminOverviewUi.test.js test/subscriptionAdminRevenueUi.test.js test/subscriptionAdminLifetimeSeparation.test.js
          git rm .github/workflows/finalize-subscriber-acquisition.yml .github/workflows/finalize-subscriber-acquisition-v2.yml
          git commit -m "Track new subscribers by acquisition month"
          git push
