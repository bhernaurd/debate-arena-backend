name: Add account activity admin

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/account-activity-admin.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply account activity patch
        run: python3 scripts/patchSubscriptionAdminAccountActivity.py
      - name: Install and validate
        run: |
          npm ci
          npm run check
          node --test test/subscriptionAdminAccountActivity.test.js test/subscriptionAdminOverviewContext.test.js test/subscriptionAdminMobileUi.test.js
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add subscriptionAdminDashboardRoutes.js lib/subscriptionAdminAccountsUi.js test/subscriptionAdminAccountActivity.test.js
          git rm scripts/patchSubscriptionAdminAccountActivity.py .github/workflows/account-activity-admin.yml
          git commit -m 'Add account activity analytics'
          git push origin HEAD:main
