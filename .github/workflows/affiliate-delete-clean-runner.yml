name: Temporary clean affiliate delete runner

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  run:
    if: github.event.issue.title == '[automation] apply clean affiliate delete patch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply affiliate delete patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          service_path = Path('lib/appStoreConnectAffiliateService.js')
          service = service_path.read_text()
          deactivate_snippet = Path('.automation/affiliate-delete/deactivateCustomCode.snippet').read_text()
          if 'async function deactivateCustomCode' not in service:
              marker = '  function affiliateSummary(affiliate) {'
              if marker not in service:
                  raise SystemExit('affiliateSummary marker missing')
              service = service.replace(marker, deactivate_snippet + marker, 1)
          if '      status: cleanText(affiliate.status),' not in service:
              service = replace_once(
                  service,
                  '      isTest: Boolean(affiliate.is_test),\n',
                  '      isTest: Boolean(affiliate.is_test),\n      status: cleanText(affiliate.status),\n',
                  'affiliate summary status'
              )
          if '    deactivateCustomCode,\n' not in service:
              service = replace_once(
                  service,
                  '    ensureCustomCode,\n    getSubscriptionPricingSummary,',
                  '    ensureCustomCode,\n    deactivateCustomCode,\n    getSubscriptionPricingSummary,',
                  'App Store service export'
              )
          service_path.write_text(service)

          routes_path = Path('affiliateRoutes.js')
          routes = routes_path.read_text()

          if '<option value="archived">Archived</option>' not in routes:
              routes = replace_once(
                  routes,
                  '              <option value="test">Sandbox/Test</option>\n',
                  '              <option value="test">Sandbox/Test</option>\n              <option value="archived">Archived</option>\n',
                  'archived filter option'
              )

          if "function productionAffiliates() { return affiliates.filter(a => !a.is_test && a.status !== 'archived'); }" not in routes:
              routes = replace_once(
                  routes,
                  '    function productionAffiliates() { return affiliates.filter(a => !a.is_test); }',
                  "    function productionAffiliates() { return affiliates.filter(a => !a.is_test && a.status !== 'archived'); }",
                  'production affiliate summary filter'
              )

          archive_filter = "        if (filter === 'archived') return a.status === 'archived';\n        if (a.status === 'archived') return false;\n\n"
          if archive_filter not in routes:
              comment_marker = '        // Keep Sandbox/Test affiliates out of every normal production view.\n'
              if comment_marker not in routes:
                  raise SystemExit('affiliate filter comment marker missing')
              routes = routes.replace(comment_marker, archive_filter + comment_marker, 1)

          delete_action = "            (a.status !== 'archived' ? '<button class=\"button small danger\" data-action=\"delete\" data-id=\"' + html(a.id) + '\">Delete</button>' : '') +\n"
          if 'data-action="delete"' not in routes:
              toggle_line = "            (canToggle ? '<button class=\"button small ' + (operationalActive ? 'danger' : 'gold') + '\" data-action=\"toggle\" data-id=\"' + html(a.id) + '\" data-active=\"' + (operationalActive ? 'false' : 'true') + '\">' + (operationalActive ? 'Pause' : 'Activate') + '</button>' : '') +\n"
              if toggle_line not in routes:
                  raise SystemExit('affiliate toggle action marker missing')
              routes = routes.replace(toggle_line, toggle_line + delete_action, 1)

          if "appleLinked.filter(item => item.linkedAffiliate?.status !== 'archived')" not in routes:
              routes = replace_once(
                  routes,
                  "      const linkedRows = appleLinked.map(item => renderAppleImportRow(item, 'linked'));",
                  "      const linkedRows = appleLinked.filter(item => item.linkedAffiliate?.status !== 'archived').map(item => renderAppleImportRow(item, 'linked'));",
                  'hide archived Apple linked rows'
              )

          if 'async function deleteAffiliate(id)' not in routes:
              ui_snippet = Path('.automation/affiliate-delete/deleteAffiliateUi.snippet').read_text()
              create_marker = '    function openCreateAffiliate(prefill = null) {'
              if create_marker not in routes:
                  raise SystemExit('create affiliate function marker missing')
              routes = routes.replace(create_marker, ui_snippet + create_marker, 1)

          delete_click = "      if (button.dataset.action === 'delete') deleteAffiliate(id);\n"
          if delete_click not in routes:
              toggle_click = "      if (button.dataset.action === 'toggle') toggleAffiliate(id, button.dataset.active === 'true');\n"
              if toggle_click not in routes:
                  raise SystemExit('affiliate toggle click marker missing')
              routes = routes.replace(toggle_click, toggle_click + delete_click, 1)

          if "router.delete('/api/admin/affiliates/:id'" not in routes:
              route_snippet = Path('.automation/affiliate-delete/deleteAffiliateRoute.snippet').read_text()
              route_marker = "  router.post('/api/admin/affiliates/:id/operational-status', adminOnly, async (req, res) => {"
              if route_marker not in routes:
                  raise SystemExit('operational status route marker missing')
              routes = routes.replace(route_marker, route_snippet + route_marker, 1)

          routes_path.write_text(routes)
          Path('test/affiliateDeleteAdmin.test.js').write_text(
              Path('.automation/affiliate-delete/affiliateDeleteAdmin.test.js').read_text()
          )
          PY

      - name: Push implementation branch
        shell: bash
        run: |
          git config user.name "Agora Automation"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B automation/affiliate-delete-apple-deactivate
          git add affiliateRoutes.js lib/appStoreConnectAffiliateService.js test/affiliateDeleteAdmin.test.js
          git commit -m "Delete affiliates with Apple code deactivation"
          git push --force origin HEAD:refs/heads/automation/affiliate-delete-apple-deactivate

      - name: Validate implementation
        run: |
          npm ci
          npm run check
          node --test test/appStoreConnectAffiliateProvisioning.test.js test/affiliateDeleteAdmin.test.js
          npm test
