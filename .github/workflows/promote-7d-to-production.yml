name: Promote 7D default to production

on:
  push:
    paths:
      - '.github/workflows/promote-7d-to-production.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify production diff is scoped
        run: |
          git fetch origin production
          git diff --name-only origin/production...HEAD
          count=$(git diff --name-only origin/production...HEAD | wc -l | tr -d ' ')
          test "$count" -eq 3
          git diff --name-only origin/production...HEAD | grep -qx '.github/workflows/production-ci.yml'
          git diff --name-only origin/production...HEAD | grep -qx 'lib/subscriptionAdminAccountsUi.js'
          git diff --name-only origin/production...HEAD | grep -qx '.github/workflows/promote-7d-to-production.yml'
      - name: Validate backend
        run: |
          npm ci
          npm run check
          npm test
      - name: Remove helper workflow
        run: |
          rm .github/workflows/promote-7d-to-production.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/promote-7d-to-production.yml
          git commit -m 'Remove temporary production promotion workflow'
          git push
