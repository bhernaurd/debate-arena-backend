name: Trigger affiliate provisioning patch

on:
  issues:
    types:
      - opened

permissions:
  contents: write

jobs:
  patch:
    if: github.event.issue.title == '[automation] affiliate app store provisioning patch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract and run the prepared patch
        shell: bash
        run: |
          sed -n "/python3 <<'PY'/,/^          PY$/p" .github/workflows/one-time-affiliate-autoprovision.yml \
            | tail -n +2 \
            | head -n -1 \
            | sed 's/^          //' > /tmp/affiliate_patch.py
          python3 /tmp/affiliate_patch.py

      - name: Remove temporary workflows from patch branch
        run: rm .github/workflows/one-time-affiliate-autoprovision.yml .github/workflows/trigger-affiliate-autoprovision.yml

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run syntax checks
        run: npm run check

      - name: Run provisioning tests
        run: node --test test/appStoreConnectAffiliateProvisioning.test.js

      - name: Commit patch branch
        shell: bash
        run: |
          git config user.name "Agora Automation"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B automation/affiliate-auto-provision-1000
          git add -A
          git commit -m "Auto-provision affiliate App Store custom codes"
          git push --force origin HEAD:refs/heads/automation/affiliate-auto-provision-1000
