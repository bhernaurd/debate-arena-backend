name: Add trials ending metric

on:
  push:
    paths:
      - '.github/workflows/add-trials-ending-metric.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply trials ending metric
        run: node scripts/addTrialsEndingMetric.mjs
      - name: Install and validate
        run: |
          npm ci
          npm run check
          node --test test/subscriptionAdminTrialsEnding.test.js test/subscriptionAdminOverviewUi.test.js test/subscriptionAdminRevenueUi.test.js
      - name: Commit implementation
        shell: bash
        run: |
          rm .github/workflows/add-trials-ending-metric.yml scripts/addTrialsEndingMetric.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add subscriptionAdminRoutes.js lib/subscriptionAdminOverviewUi.js lib/subscriptionAdminLifetimeUi.js test/subscriptionAdminTrialsEnding.test.js .github/workflows/add-trials-ending-metric.yml scripts/addTrialsEndingMetric.mjs
          git commit -m 'Track trials ending before conversion'
          git push
