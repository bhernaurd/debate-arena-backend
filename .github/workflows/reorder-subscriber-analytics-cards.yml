name: Reorder subscriber analytics cards

on:
  push:
    paths:
      - '.github/workflows/reorder-subscriber-analytics-cards.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Reorder cards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/subscriptionAdminOverviewUi.js')
          text = path.read_text()
          old = "        metric('Annual',m.paid_annual||0,'Active paid annual subscribers'),\\n        metric('Lifetime',m.active_lifetime_pro||0,'Permanent Pro access'),\\n        metric('Canceling',m.canceling_subscriptions||0,'Auto-renew off while access remains')"
          new = "        metric('Annual',m.paid_annual||0,'Active paid annual subscribers'),\\n        metric('Canceling',m.canceling_subscriptions||0,'Auto-renew off while access remains'),\\n        metric('Lifetime',m.active_lifetime_pro||0,'Permanent Pro access')"
          if old not in text:
              raise SystemExit('Expected Subscriber Analytics card order was not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate
        run: |
          npm ci
          npm run check
          node --test test/subscriptionAdminOverviewUi.test.js test/subscriptionAdminLifetimeSeparation.test.js
      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/reorder-subscriber-analytics-cards.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/subscriptionAdminOverviewUi.js .github/workflows/reorder-subscriber-analytics-cards.yml
          git commit -m 'Prioritize canceling subscriber metric'
          git push
