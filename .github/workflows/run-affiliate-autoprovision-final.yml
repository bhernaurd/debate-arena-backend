name: Run affiliate autoprovision final

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.issue.title == '[automation] run affiliate autoprovision final'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Apply prepared patch
        shell: bash
        run: |
          sed -n "/python3 <<'PY'/,/^          PY$/p" .github/workflows/affiliate-autoprovision-v2.yml \
            | tail -n +2 \
            | head -n -1 \
            | sed 's/^          //' > /tmp/affiliate_patch.py
          python3 /tmp/affiliate_patch.py
      - name: Validate
        run: |
          npm ci
          npm run check
          node --test test/appStoreConnectAffiliateProvisioning.test.js
          npm test
      - name: Commit only product changes
        shell: bash
        run: |
          git config user.name "Agora Automation"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B automation/affiliate-auto-provision-1000-final
          git add affiliateRoutes.js lib/appStoreConnectAffiliateService.js test/appStoreConnectAffiliateProvisioning.test.js
          git commit -m "Auto-provision affiliate App Store custom codes"
          git push --force origin HEAD:refs/heads/automation/affiliate-auto-provision-1000-final
