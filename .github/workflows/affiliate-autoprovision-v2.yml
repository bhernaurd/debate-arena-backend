name: Affiliate autoprovision v2

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.issue.title == '[automation] affiliate autoprovision v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply affiliate App Store provisioning patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def insert_before(text, marker, addition, label):
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(f'{label}: expected one marker, found {count}')
              return text.replace(marker, addition + marker, 1)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          # 1) App Store Connect service: add idempotent custom-code creation.
          service_path = Path('lib/appStoreConnectAffiliateService.js')
          service = service_path.read_text()

          if 'async function ensureCustomCode({' not in service:
              service_addition = r'''  function normalizeCustomCodeCount(value, fallback = 1000) {
    const candidate = value == null || String(value).trim() === ''
      ? fallback
      : Number(value);

    if (!Number.isInteger(candidate) || candidate < 1 || candidate > 25000) {
      throw statusError(
        400,
        'Apple custom-code redemption limit must be an integer between 1 and 25,000.',
        'invalid_app_store_connect_custom_code_count'
      );
    }

    return candidate;
  }

  async function ensureCustomCode({
    offerReferenceName,
    customCode,
    numberOfCodes = 1000,
    expirationDate = null,
  } = {}) {
    assertConfigured();

    const normalizedOfferName = normalizeAppleOfferIdentifier(offerReferenceName);
    const normalizedCustomCode = normalizeAffiliateCode(customCode);
    const cleanNumberOfCodes = normalizeCustomCodeCount(numberOfCodes, 1000);
    const cleanExpirationDate = cleanText(expirationDate);

    if (!normalizedOfferName) {
      throw statusError(
        400,
        'An App Store Connect offer reference name is required.',
        'app_store_connect_offer_reference_required'
      );
    }

    if (!normalizedCustomCode) {
      throw statusError(
        400,
        'A creator code is required.',
        'app_store_connect_custom_code_required'
      );
    }

    if (cleanExpirationDate && !/^\d{4}-\d{2}-\d{2}$/.test(cleanExpirationDate)) {
      throw statusError(
        400,
        'Apple custom-code expiration date must be YYYY-MM-DD.',
        'invalid_app_store_connect_custom_code_expiration'
      );
    }

    const offers = await listOfferCodes();
    const matchingOffers = offers.filter(
      offer => offer.normalizedName === normalizedOfferName
    );

    if (!matchingOffers.length) {
      throw statusError(
        404,
        `No App Store Connect offer matches “${cleanText(offerReferenceName)}”.`,
        'app_store_connect_offer_not_found'
      );
    }

    const activeMatches = matchingOffers.filter(offer => offer.active === true);
    const offer = activeMatches.length === 1
      ? activeMatches[0]
      : matchingOffers.length === 1
        ? matchingOffers[0]
        : null;

    if (!offer) {
      throw statusError(
        409,
        `More than one App Store Connect offer matches “${cleanText(offerReferenceName)}”.`,
        'app_store_connect_offer_ambiguous'
      );
    }

    for (const candidateOffer of offers) {
      for (const candidateCode of candidateOffer.customCodes || []) {
        if (
          candidateCode.customCode !== normalizedCustomCode ||
          candidateCode.active !== true
        ) {
          continue;
        }

        if (candidateOffer.id === offer.id) {
          return {
            created: false,
            status: 'already_exists',
            offerId: offer.id,
            offerName: offer.name,
            customCodeId: candidateCode.id,
            customCode: normalizedCustomCode,
            numberOfCodes: candidateCode.numberOfCodes,
            active: candidateCode.active,
            expirationDate: candidateCode.expirationDate || null,
          };
        }

        throw statusError(
          409,
          `${normalizedCustomCode} is already active on a different App Store Connect offer (${candidateOffer.name || candidateOffer.id}).`,
          'app_store_connect_custom_code_conflict'
        );
      }
    }

    const attributes = {
      customCode: normalizedCustomCode,
      numberOfCodes: cleanNumberOfCodes,
    };
    if (cleanExpirationDate) attributes.expirationDate = cleanExpirationDate;

    const payload = await apiFetch('/subscriptionOfferCodeCustomCodes', {
      method: 'POST',
      body: {
        data: {
          type: 'subscriptionOfferCodeCustomCodes',
          attributes,
          relationships: {
            offerCode: {
              data: {
                type: 'subscriptionOfferCodes',
                id: offer.id,
              },
            },
          },
        },
      },
    });

    const createdCode = mapCustomCode(payload?.data || {});
    return {
      created: true,
      status: 'created',
      offerId: offer.id,
      offerName: offer.name,
      customCodeId: createdCode.id || null,
      customCode: createdCode.customCode || normalizedCustomCode,
      numberOfCodes: createdCode.numberOfCodes ?? cleanNumberOfCodes,
      active: createdCode.active,
      expirationDate: createdCode.expirationDate || cleanExpirationDate || null,
    };
  }

'''
              service = insert_before(
                  service,
                  '  function affiliateSummary(affiliate) {',
                  service_addition,
                  'service insertion'
              )

          if '    ensureCustomCode,\n' not in service:
              service = replace_once(
                  service,
                  '    listImports,\n    getSubscriptionPricingSummary,',
                  '    listImports,\n    ensureCustomCode,\n    getSubscriptionPricingSummary,',
                  'service export'
              )

          service_path.write_text(service)

          # 2) Admin routes: provision after Agora creation, never duplicate an
          # already-active Apple code, and expose an explicit retry endpoint.
          routes_path = Path('affiliateRoutes.js')
          routes = routes_path.read_text()

          old_copy = 'This creates the Agora affiliate record only. The Apple Offer Code campaign itself must already exist in App Store Connect. Once an offer exists in Apple, it will automatically appear above under App Store Connect Imports after sync.'
          new_copy = 'This creates the Agora affiliate and automatically creates its creator code in the shared App Store Connect offer. New production creator codes default to 1,000 redemptions. If the code already exists in that Apple offer, Agora links it without creating a duplicate.'
          if old_copy in routes:
              routes = routes.replace(old_copy, new_copy, 1)

          helper = r'''  async function provisionAffiliateAppleCode(affiliate, numberOfCodes = 1000) {
    if (!affiliate || affiliate.is_test) {
      return {
        created: false,
        status: 'skipped',
        reason: 'test_affiliate',
      };
    }

    if (typeof appStoreConnectService?.ensureCustomCode !== 'function') {
      const error = new Error('App Store Connect custom-code provisioning is unavailable.');
      error.statusCode = 503;
      error.code = 'app_store_connect_custom_code_provisioning_unavailable';
      throw error;
    }

    return appStoreConnectService.ensureCustomCode({
      offerReferenceName: affiliate.apple_offer_identifier,
      customCode: affiliate.normalized_code,
      numberOfCodes,
    });
  }

'''
          create_route = "  router.post('/api/admin/affiliates', adminOnly, async (req, res) => {"
          if 'async function provisionAffiliateAppleCode(' not in routes:
              routes = insert_before(routes, create_route, helper, 'route helper insertion')

          old_create = """  router.post('/api/admin/affiliates', adminOnly, async (req, res) => {
    try {
      const actor = req.get('x-admin-actor') || 'owner_admin';
      const created = await service.createAffiliate(req.body || {}, actor);
      return res.status(201).json({ success: true, ...created });
    } catch (error) {
"""
          new_create = """  router.post('/api/admin/affiliates', adminOnly, async (req, res) => {
    try {
      const actor = req.get('x-admin-actor') || 'owner_admin';
      const created = await service.createAffiliate(req.body || {}, actor);
      let appleProvisioning = {
        created: false,
        status: 'skipped',
        reason: 'test_affiliate',
      };

      if (created?.affiliate?.is_test !== true) {
        try {
          appleProvisioning = await provisionAffiliateAppleCode(
            created.affiliate,
            req.body?.appleCustomCodeCount ?? 1000
          );
        } catch (appleError) {
          console.error('[affiliate] automatic App Store Connect creator-code provisioning:', {
            code: appleError?.code || 'app_store_connect_custom_code_provisioning_failed',
            message: appleError?.message || String(appleError),
            affiliateId: created?.affiliate?.id || null,
            customCode: created?.affiliate?.normalized_code || null,
          });
          appleProvisioning = {
            created: false,
            status: 'failed',
            code: appleError?.code || 'app_store_connect_custom_code_provisioning_failed',
            message: appleError?.message || 'App Store Connect creator-code provisioning failed.',
          };
        }
      }

      return res.status(201).json({ success: true, ...created, appleProvisioning });
    } catch (error) {
"""
          if old_create in routes:
              routes = routes.replace(old_create, new_create, 1)
          elif 'automatic App Store Connect creator-code provisioning:' not in routes:
              raise SystemExit('affiliate create route did not match')

          retry_route = r'''  router.post('/api/admin/affiliates/:id/app-store-connect-code', adminOnly, async (req, res) => {
    try {
      const affiliates = await service.listAffiliates();
      const affiliate = affiliates.find(
        item => String(item?.id || '') === String(req.params.id || '')
      );

      if (!affiliate) {
        const error = new Error('Affiliate not found.');
        error.statusCode = 404;
        error.code = 'affiliate_not_found';
        throw error;
      }

      if (affiliate.is_test) {
        const error = new Error('Sandbox/test affiliates do not create production App Store Connect custom codes.');
        error.statusCode = 400;
        error.code = 'affiliate_test_apple_provisioning_not_allowed';
        throw error;
      }

      const appleProvisioning = await provisionAffiliateAppleCode(
        affiliate,
        req.body?.numberOfCodes ?? 1000
      );
      return res.json({ success: true, appleProvisioning });
    } catch (error) {
      return jsonError(res, error);
    }
  });

'''
          retry_marker = "  router.post('/api/admin/affiliates/:id/regenerate-dashboard-token', adminOnly, async (req, res) => {"
          if "'/api/admin/affiliates/:id/app-store-connect-code'" not in routes:
              routes = insert_before(routes, retry_marker, retry_route, 'retry route insertion')

          # 3) Admin modal: surface Apple connection result and let the owner
          # retry without recreating the Agora affiliate record.
          modal_start = "        $('modal').innerHTML = '<h2>Affiliate Created</h2>"
          modal_end = '        await Promise.all([loadAffiliates(false), loadAppleImports(false)]);'
          if "data-modal-action=\"retry-apple\"" not in routes:
              start = routes.find(modal_start)
              if start < 0:
                  raise SystemExit('Affiliate Created modal start not found')
              end = routes.find(modal_end, start)
              if end < 0:
                  raise SystemExit('Affiliate Created modal end not found')
              replacement = r'''        const appleProvisioning = payload.appleProvisioning || {};
        const appleConnected = ['created','already_exists'].includes(appleProvisioning.status);
        const appleMessage = isTest
          ? 'Sandbox/test affiliate created. Automatic production Apple provisioning was skipped.'
          : appleConnected
            ? (appleProvisioning.status === 'created'
                ? 'Apple creator code created automatically with ' + number(appleProvisioning.numberOfCodes || 1000) + ' redemptions.'
                : 'Apple creator code already existed in the shared offer and is linked.')
            : 'Affiliate created, but the Apple creator code still needs attention: ' + String(appleProvisioning.message || 'Apple provisioning failed.');
        $('modal').innerHTML = '<h2>Affiliate Created</h2><div class="modal-sub">Copy these links now. The private dashboard link can also be recovered later from this admin dashboard when encrypted token storage is configured.</div>' +
          '<div class="result-box">' + resultLine('Referral Link', payload.referralUrl) + resultLine('Private Dashboard', payload.dashboardUrl) + resultLine('Apple Redemption', payload.appleRedemptionUrl) + '</div>' +
          '<div class="' + (appleConnected || isTest ? 'result-box' : 'notice danger') + '" style="margin-top:12px">' + html(appleMessage) + '</div>' +
          '<div class="modal-actions">' +
            (!isTest && !appleConnected && payload.affiliate?.id ? '<button class="button" data-modal-action="retry-apple" data-affiliate-id="' + html(payload.affiliate.id) + '">Retry Apple Connection</button>' : '') +
            '<button class="button gold" data-modal-action="close-refresh">Done</button></div>';
'''
              routes = routes[:start] + replacement + routes[end:]

          retry_fn_marker = '    function resultLine(label, value) {'
          if 'async function retryAppleConnection(affiliateId)' not in routes:
              retry_fn = r'''    async function retryAppleConnection(affiliateId) {
      try {
        const payload = await adminFetch('/api/admin/affiliates/' + encodeURIComponent(affiliateId) + '/app-store-connect-code', {
          method:'POST', body:{ numberOfCodes:1000 }
        });
        const provisioning = payload.appleProvisioning || {};
        toast(provisioning.status === 'created'
          ? 'Apple creator code created with 1,000 redemptions.'
          : 'Apple creator code is connected.');
        closeModal();
        await Promise.all([loadAffiliates(false), loadAppleImports(false)]);
      } catch (error) { toast(error.message, true); }
    }

'''
              routes = insert_before(routes, retry_fn_marker, retry_fn, 'retry function insertion')

          action_line = "      if (name === 'create-affiliate') await createAffiliateFromModal();"
          if "if (name === 'retry-apple')" not in routes:
              routes = replace_once(
                  routes,
                  action_line,
                  action_line + "\n      if (name === 'retry-apple') await retryAppleConnection(action.dataset.affiliateId);",
                  'retry modal action'
              )

          routes_path.write_text(routes)

          # 4) Focused tests for default 1,000, idempotency, and conflict safety.
          Path('test/appStoreConnectAffiliateProvisioning.test.js').write_text(r'''import assert from 'node:assert/strict';
import crypto from 'node:crypto';
import fs from 'node:fs';
import test from 'node:test';

import { createAppStoreConnectAffiliateService } from '../lib/appStoreConnectAffiliateService.js';

function privateKeyPem() {
  const { privateKey } = crypto.generateKeyPairSync('ec', { namedCurve: 'P-256' });
  return privateKey.export({ type: 'pkcs8', format: 'pem' });
}

function response(status, body) {
  return {
    ok: status >= 200 && status < 300,
    status,
    async text() { return body == null ? '' : JSON.stringify(body); },
  };
}

function buildService(handler) {
  const calls = [];
  const service = createAppStoreConnectAffiliateService({
    issuerId: 'issuer-id',
    keyId: 'key-id',
    privateKey: privateKeyPem(),
    subscriptionId: 'subscription-id',
    fetchImpl: async (url, options = {}) => {
      const call = {
        url: String(url),
        method: options.method || 'GET',
        body: options.body ? JSON.parse(options.body) : null,
      };
      calls.push(call);
      return handler(call);
    },
  });
  return { service, calls };
}

function offer(id, name, active = true) {
  return {
    type: 'subscriptionOfferCodes', id,
    attributes: { name, active, customerEligibilities: [] },
  };
}

function customCode(id, code, { active = true, numberOfCodes = 1000 } = {}) {
  return {
    type: 'subscriptionOfferCodeCustomCodes', id,
    attributes: { customCode: code, active, numberOfCodes, createdDate: '2026-08-24T12:00:00Z' },
  };
}

test('ensureCustomCode creates 1,000 redemptions by default', async () => {
  const { service, calls } = buildService(call => {
    const url = new URL(call.url);
    if (call.method === 'GET' && url.pathname.endsWith('/subscriptions/subscription-id/offerCodes')) {
      return response(200, { data: [offer('offer-1', 'Affiliate First Month $0.99')], links: {} });
    }
    if (call.method === 'GET' && url.pathname.endsWith('/subscriptionOfferCodes/offer-1/customCodes')) {
      return response(200, { data: [], links: {} });
    }
    if (call.method === 'POST' && url.pathname.endsWith('/subscriptionOfferCodeCustomCodes')) {
      return response(201, { data: customCode('custom-1', 'NEWCREATOR') });
    }
    throw new Error(`Unexpected request: ${call.method} ${url.pathname}`);
  });

  const result = await service.ensureCustomCode({
    offerReferenceName: 'Affiliate First Month $0.99',
    customCode: 'newcreator',
  });
  assert.equal(result.status, 'created');
  assert.equal(result.numberOfCodes, 1000);
  const post = calls.find(call => call.method === 'POST');
  assert.deepEqual(post.body.data.attributes, { customCode: 'NEWCREATOR', numberOfCodes: 1000 });
  assert.deepEqual(post.body.data.relationships.offerCode.data, { type: 'subscriptionOfferCodes', id: 'offer-1' });
});

test('ensureCustomCode reuses an existing active code on the shared offer', async () => {
  const { service, calls } = buildService(call => {
    const url = new URL(call.url);
    if (call.method === 'GET' && url.pathname.endsWith('/subscriptions/subscription-id/offerCodes')) {
      return response(200, { data: [offer('offer-1', 'Affiliate First Month $0.99')], links: {} });
    }
    if (call.method === 'GET' && url.pathname.endsWith('/subscriptionOfferCodes/offer-1/customCodes')) {
      return response(200, { data: [customCode('custom-existing', '365PUSHING')], links: {} });
    }
    throw new Error(`Unexpected request: ${call.method} ${url.pathname}`);
  });

  const result = await service.ensureCustomCode({
    offerReferenceName: 'Affiliate First Month $0.99',
    customCode: '365PUSHING',
  });
  assert.equal(result.status, 'already_exists');
  assert.equal(result.customCodeId, 'custom-existing');
  assert.equal(calls.some(call => call.method === 'POST'), false);
});

test('ensureCustomCode rejects the same active code on a different offer', async () => {
  const { service } = buildService(call => {
    const url = new URL(call.url);
    if (call.method === 'GET' && url.pathname.endsWith('/subscriptions/subscription-id/offerCodes')) {
      return response(200, { data: [offer('target', 'Affiliate First Month $0.99'), offer('other', 'Other Campaign')], links: {} });
    }
    if (call.method === 'GET' && url.pathname.endsWith('/subscriptionOfferCodes/target/customCodes')) {
      return response(200, { data: [], links: {} });
    }
    if (call.method === 'GET' && url.pathname.endsWith('/subscriptionOfferCodes/other/customCodes')) {
      return response(200, { data: [customCode('taken', 'TAKENCODE')], links: {} });
    }
    throw new Error(`Unexpected request: ${call.method} ${url.pathname}`);
  });

  await assert.rejects(
    service.ensureCustomCode({ offerReferenceName: 'Affiliate First Month $0.99', customCode: 'TAKENCODE' }),
    error => error?.code === 'app_store_connect_custom_code_conflict'
  );
});

test('Affiliate Admin is wired for automatic provisioning and retry', () => {
  const source = fs.readFileSync(new URL('../affiliateRoutes.js', import.meta.url), 'utf8');
  assert.match(source, /req\.body\?\.appleCustomCodeCount \?\? 1000/);
  assert.match(source, /automatic App Store Connect creator-code provisioning/);
  assert.match(source, /Retry Apple Connection/);
  assert.match(source, /numberOfCodes:1000/);
});
''')
          PY

      - name: Remove temporary automation files
        run: |
          rm -f .github/workflows/one-time-affiliate-autoprovision.yml
          rm -f .github/workflows/trigger-affiliate-autoprovision.yml
          rm -f .github/workflows/probe-issue-trigger.yml
          rm -f .github/workflows/affiliate-autoprovision-v2.yml
          rm -f .automation-probe

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run syntax checks
        run: npm run check

      - name: Run focused provisioning tests
        run: node --test test/appStoreConnectAffiliateProvisioning.test.js

      - name: Run full automated tests
        run: npm test

      - name: Commit patch branch
        shell: bash
        run: |
          git config user.name "Agora Automation"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B automation/affiliate-auto-provision-1000-v2
          git add -A
          git commit -m "Auto-provision affiliate App Store custom codes"
          git push --force origin HEAD:refs/heads/automation/affiliate-auto-provision-1000-v2
