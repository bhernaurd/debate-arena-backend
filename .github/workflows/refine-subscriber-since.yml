name: Refine subscriber since

on:
  push:
    paths:
      - '.github/workflows/refine-subscriber-since.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Refine subscriber start sorting
        run: python3 .github/scripts/refine_subscriber_since.py
      - name: Validate
        run: |
          npm ci
          npm run check
          node --test test/subscriptionAdminSubscriberSorting.test.js
      - name: Commit refinement
        shell: bash
        run: |
          rm .github/workflows/refine-subscriber-since.yml
          rm .github/scripts/refine_subscriber_since.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add subscriptionAdminRoutes.js lib/subscriptionAdminSubscribersUi.js test/subscriptionAdminSubscriberSorting.test.js .github/workflows/refine-subscriber-since.yml .github/scripts/refine_subscriber_since.py
          git commit -m 'Use first subscription date for subscriber sorting'
          git push
