name: Probe issue trigger

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  probe:
    if: github.event.issue.title == '[automation] workflow probe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: |
          git config user.name "Agora Automation"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B automation/workflow-probe
          echo "ok" > .automation-probe
          git add .automation-probe
          git commit -m "Probe issue-triggered Actions"
          git push --force origin HEAD:refs/heads/automation/workflow-probe
