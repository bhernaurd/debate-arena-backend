name: Finalize subscription lifetime separation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-subscription-lifetime-separation.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Separate Lifetime Pro from subscription health
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          function replaceOnce(text, oldValue, newValue, label) {
            const index = text.indexOf(oldValue);
            if (index < 0) throw new Error(`Patch target not found: ${label}`);
            if (text.indexOf(oldValue, index + oldValue.length) >= 0) {
              throw new Error(`Patch target is not unique: ${label}`);
            }
            return text.slice(0, index) + newValue + text.slice(index + oldValue.length);
          }

          fs.writeFileSync('lib/subscriptionAdminLifetimeUi.js', `export function enhanceSubscriptionAdminLifetimeHtml(html) {
            let output = String(html);

            output = output
              .replace(
                "metric('Active Pro',m.active_pro_entitlements||0,'All production Pro entitlements')",
                "metric('Active subscriptions',Math.max(0,Number(m.active_pro_entitlements||0)-Number(m.active_lifetime_pro||0)),Number(m.active_paid_subscribers||0)+' paid · '+Number(m.active_trials||0)+' trial'+(Number(m.active_trials||0)===1?'':'s'))"
              )
              .replace(
                "metric('Paid subscribers',m.active_paid_subscribers||0,'Monthly + annual, excluding trials'),",
                "metric('Paid subscribers',m.active_paid_subscribers||0,'Monthly + annual, excluding trials'),\\n        metric('Lifetime Pro',m.active_lifetime_pro||0,'Permanent access · no renewal'),"
              )
              .replace(
                '.grid { display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px; }',
                '.grid { display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px; }\\n    #metrics { grid-template-columns:repeat(5,minmax(0,1fr)); }\\n    @media (max-width:1200px){ #metrics{grid-template-columns:repeat(3,1fr)} }\\n    @media (max-width:760px){ #metrics{grid-template-columns:1fr 1fr} }'
              )
              .replace(
                '<h2>Active Pro growth</h2><span id="breakdownChartSummary">Active Pro over time</span>',
                '<h2>Active subscription growth</h2><span id="breakdownChartSummary">Subscriptions over time</span>'
              )
              .replaceAll('Loading Active Pro growth...', 'Loading subscription growth...')
              .replaceAll('No Active Pro history yet.', 'No subscription history yet.')
              .replaceAll("summary.textContent='Active Pro over time'", "summary.textContent='Subscriptions over time'")
              .replaceAll('aria-label="Active Pro growth by month"', 'aria-label="Active subscription growth by month"')
              .replace(
                'const currentTotal=Number(overview.metrics?.active_pro_entitlements||0);',
                'const currentTotal=Math.max(0,Number(overview.metrics?.active_pro_entitlements||0)-Number(overview.metrics?.active_lifetime_pro||0));'
              )
              .replaceAll('activeProAtMonthEnd', 'activeSubscriptionsAtMonthEnd')
              .replace(
                "metric('Total subscribers',m.active_pro_entitlements||0,'All active production Pro access')",
                "metric('Active subscriptions',Math.max(0,Number(m.active_pro_entitlements||0)-Number(m.active_lifetime_pro||0)),'Monthly + annual subscriptions and trials')"
              )
              .replace(
                "metric('Total subscribers',row.activeSubscriptionsAtMonthEnd==null?'N/A':row.activeSubscriptionsAtMonthEnd,'Active Pro at the end of '+subscriberMonthLabel(row.month))",
                "metric('Active subscriptions',row.activeSubscriptionsAtMonthEnd==null?'N/A':row.activeSubscriptionsAtMonthEnd,'Monthly + annual subscriptions active at the end of '+subscriberMonthLabel(row.month))"
              )
              .replaceAll('<th>Active Pro at end</th>', '<th>Active subscriptions at end</th>')
              .replaceAll('month-end subscriber total.', 'month-end subscription total.');

            return output;
          }

          export default enhanceSubscriptionAdminLifetimeHtml;
          `);

          {
            const path = 'subscriptionAdminDashboardRoutes.js';
            let text = fs.readFileSync(path, 'utf8');
            text = replaceOnce(
              text,
              `import {\n  enhanceSubscriptionAdminRevenueHtml,\n} from './lib/subscriptionAdminRevenueUi.js';\n`,
              `import {\n  enhanceSubscriptionAdminRevenueHtml,\n} from './lib/subscriptionAdminRevenueUi.js';\nimport {\n  enhanceSubscriptionAdminLifetimeHtml,\n} from './lib/subscriptionAdminLifetimeUi.js';\n`,
              'lifetime enhancer import'
            );
            text = replaceOnce(
              text,
              `          ? enhanceSubscriptionAdminRevenueHtml(\n              enhanceSubscriptionAdminOverviewHtml(\n              enhanceSubscriptionAdminPayoutHtml(\n                enhanceSubscriptionAdminHistoryHtml(\n                  enhanceDashboardHtml(body)\n                )\n              )\n            )\n          )\n          : body;`,
              `          ? enhanceSubscriptionAdminLifetimeHtml(\n              enhanceSubscriptionAdminRevenueHtml(\n                enhanceSubscriptionAdminOverviewHtml(\n                  enhanceSubscriptionAdminPayoutHtml(\n                    enhanceSubscriptionAdminHistoryHtml(\n                      enhanceDashboardHtml(body)\n                    )\n                  )\n                )\n              )\n            )\n          : body;`,
              'dashboard enhancer composition'
            );
            fs.writeFileSync(path, text);
          }

          {
            const path = 'lib/subscriptionAdminHistoryService.js';
            let text = fs.readFileSync(path, 'utf8');
            text = replaceOnce(
              text,
              `    activeProAtMonthEnd: null,\n`,
              `    activeProAtMonthEnd: null,\n    activeSubscriptionsAtMonthEnd: null,\n`,
              'empty month recurring total'
            );
            text = replaceOnce(
              text,
              `        COUNT(DISTINCT transaction.customer_key)::int AS active_pro_at_month_end\n`,
              `        COUNT(DISTINCT transaction.customer_key)::int AS active_pro_at_month_end,\n        COUNT(DISTINCT transaction.customer_key) FILTER (\n          WHERE transaction.product_id IN ('agora_pro_monthly', 'agora_pro_yearly')\n        )::int AS active_subscriptions_at_month_end\n`,
              'historical recurring subscription count'
            );
            text = replaceOnce(
              text,
              `    month.activeProAtMonthEnd = numberValue(row.active_pro_at_month_end);\n`,
              `    month.activeProAtMonthEnd = numberValue(row.active_pro_at_month_end);\n    month.activeSubscriptionsAtMonthEnd = numberValue(row.active_subscriptions_at_month_end);\n`,
              'historical recurring subscription assignment'
            );
            fs.writeFileSync(path, text);
          }

          {
            const path = 'test/subscriptionAdminRevenueUi.test.js';
            let text = fs.readFileSync(path, 'utf8');
            text = replaceOnce(
              text,
              `import { enhanceSubscriptionAdminRevenueHtml } from '../lib/subscriptionAdminRevenueUi.js';\n`,
              `import { enhanceSubscriptionAdminRevenueHtml } from '../lib/subscriptionAdminRevenueUi.js';\nimport { enhanceSubscriptionAdminLifetimeHtml } from '../lib/subscriptionAdminLifetimeUi.js';\n`,
              'revenue test lifetime import'
            );
            text = replaceOnce(
              text,
              `  output = enhanceSubscriptionAdminRevenueHtml(output);\n  return output;`,
              `  output = enhanceSubscriptionAdminRevenueHtml(output);\n  output = enhanceSubscriptionAdminLifetimeHtml(output);\n  return output;`,
              'revenue test final enhancer'
            );
            text = text
              .replace("test('Subscriber Analytics uses clear trial and Active Pro terminology'", "test('Subscriber Analytics separates recurring subscriptions from Lifetime Pro'")
              .replace(`  assert.match(breakdown, /<h2>Active Pro growth<\\/h2>/);`, `  assert.match(breakdown, /<h2>Active subscription growth<\\/h2>/);`)
              .replace(`  assert.match(breakdown, /id="breakdownChartSummary">Active Pro over time<\\/span>/);`, `  assert.match(breakdown, /id="breakdownChartSummary">Subscriptions over time<\\/span>/);`);
            fs.writeFileSync(path, text);
          }

          {
            const path = 'test/subscriptionAdminOverviewUi.test.js';
            let text = fs.readFileSync(path, 'utf8');
            text = replaceOnce(
              text,
              `import { enhanceSubscriptionAdminOverviewHtml } from '../lib/subscriptionAdminOverviewUi.js';\n`,
              `import { enhanceSubscriptionAdminOverviewHtml } from '../lib/subscriptionAdminOverviewUi.js';\nimport { enhanceSubscriptionAdminLifetimeHtml } from '../lib/subscriptionAdminLifetimeUi.js';\n`,
              'overview test lifetime import'
            );
            text = replaceOnce(
              text,
              `  output = enhanceSubscriptionAdminOverviewHtml(output);\n  return output;`,
              `  output = enhanceSubscriptionAdminOverviewHtml(output);\n  output = enhanceSubscriptionAdminLifetimeHtml(output);\n  return output;`,
              'overview test final enhancer'
            );
            text = text
              .replace("test('Overview keeps four primary KPIs and moves subscriber detail to Breakdown'", "test('Overview separates Lifetime Pro from active subscriptions'")
              .replace(`  assert.match(loadOverview, /metric\\('Active Pro'/);`, `  assert.match(loadOverview, /metric\\('Active subscriptions'/);`)
              .replace(`  assert.doesNotMatch(loadOverview, /metric\\('Lifetime'/);`, `  assert.match(loadOverview, /metric\\('Lifetime Pro'/);\\n  assert.doesNotMatch(loadOverview, /metric\\('Lifetime'/);`)
              .replace(`  assert.match(html, /activeProAtMonthEnd/);`, `  assert.match(html, /activeSubscriptionsAtMonthEnd/);`)
              .replace(`  assert.match(html, /metric\\('Total subscribers'/);`, `  assert.match(html, /metric\\('Active subscriptions'/);`);
            fs.writeFileSync(path, text);
          }

          fs.writeFileSync('test/subscriptionAdminLifetimeSeparation.test.js', `import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import test from 'node:test';

          test('history tracks month-end subscriptions separately from Lifetime Pro', () => {
            const source = fs.readFileSync(new URL('../lib/subscriptionAdminHistoryService.js', import.meta.url), 'utf8');
            assert.match(source, /activeSubscriptionsAtMonthEnd: null/);
            assert.match(source, /AS active_subscriptions_at_month_end/);
            assert.match(source, /product_id IN \\('agora_pro_monthly', 'agora_pro_yearly'\\)/);
            assert.match(source, /activeSubscriptionsAtMonthEnd = numberValue\\(row\\.active_subscriptions_at_month_end\\)/);
          });
          `);
          NODE
      - run: npm ci
      - name: Targeted dashboard tests
        run: node --test test/subscriptionAdminOverviewUi.test.js test/subscriptionAdminRevenueUi.test.js test/subscriptionAdminLifetimeSeparation.test.js
      - name: Syntax checks
        run: npm run check
      - name: Commit Lifetime separation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add subscriptionAdminDashboardRoutes.js lib/subscriptionAdminHistoryService.js lib/subscriptionAdminLifetimeUi.js test/subscriptionAdminOverviewUi.test.js test/subscriptionAdminRevenueUi.test.js test/subscriptionAdminLifetimeSeparation.test.js
          git rm .github/workflows/finalize-subscription-lifetime-separation.yml
          git commit -m "Separate Lifetime Pro from subscription health"
          git push
